<!doctype html><meta charset=utf-8><title>probe</title><pre id=o>pending</pre>
<script>
const o=document.getElementById('o');
try{
navigator.requestMediaKeySystemAccess('com.widevine.alpha',[{
  videoCapabilities:[{contentType:'video/mp4; codecs="avc1.42E01E"'}],
  audioCapabilities:[{contentType:'audio/mp4; codecs="mp4a.40.2"'}]
}]).then(function(){o.textContent='CDM_OK';document.title='CDM_OK';})
.catch(function(e){o.textContent='CDM_FAIL:'+e.name+':'+e.message;document.title='CDM_FAIL';});
}catch(e){o.textContent='CDM_THROW:'+e.name;document.title='CDM_THROW';}
</script>
