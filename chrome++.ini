[general]
data_dir=%app%\..\Data
cache_dir=%app%\..\Cache
; --disable-component-update is DELIBERATELY absent (issue #10).
; Chromium registers the Widevine CDM as a *preinstalled component*
; (component_updater::RegisterComponentsForUpdate is not even called when that
; switch is present — chrome/browser/chrome_browser_main.cc), so the switch
; makes Chrome never find the preinstalled CDM shipped at Helium\WidevineCdm:
; DRM breaks. Component updates stay disabled through the policy instead
; (debloater.reg: ComponentUpdatesEnabled=0 + UpdateDefault=0), which does not
; gate preinstalled-component registration.
; --breakpad-dump-location keeps Crashpad inside the portable folder (issue #9):
; on Windows Crashpad is stored in <default user data dir>\Crashpad
; (chrome/common/chrome_paths.cc DIR_CRASH_DUMPS) and --user-data-dir is ignored
; on purpose (TODO crbug.com/40447560), so without this the browser recreates
; %LOCALAPPDATA%\imput\Helium\User Data\Crashpad on every launch.
; Relative paths resolve against chrome.exe's working directory (Helium\), so
; this lands at Helium\..\Data\Crashpad = the portable Data folder.
command_line=--no-first-run --no-default-browser-check --breakpad-dump-location=..\Data\Crashpad
launch_on_startup=
launch_on_exit=
boss_key=
translate_key=
show_password=0
win32k=0
ignore_policies=0
; policy_key is a no-op on chrome_plus 1.18.2 (chrome-next-mini option, kept for hibbiki parity)
policy_key=Portable
[tabs]
double_click_close=0
right_click_close=0
keep_last_tab=1
wheel_tab=1
wheel_tab_when_press_rbutton=1
open_url_new_tab=0
open_bookmark_new_tab=0
new_tab_disable=1
new_tab_disable_name="about:blank"
