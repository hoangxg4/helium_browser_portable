name: Validate

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Validate JSON
      run: |
        echo "==> Checking WidevineCdm/manifest.json"
        jq '.' WidevineCdm/manifest.json > /dev/null && echo "  OK" || { echo "  INVALID JSON"; exit 1; }

        # Check required fields
        VER=$(jq -r '.version' WidevineCdm/manifest.json)
        echo "  WidevineCdm version: $VER"
        [ -n "$VER" ] && [ "$VER" != "null" ] || { echo "  ERROR: missing version"; exit 1; }

        PLAT=$(jq -r '.platforms[0].sub_package_path' WidevineCdm/manifest.json)
        echo "  Platform path: $PLAT"
        [ -d "WidevineCdm/$PLAT" ] || { echo "  ERROR: declared platform dir WidevineCdm/$PLAT does not exist"; exit 1; }
        # Only win_x64 is ever shipped: the arm64 release carries no CDM at all
        # because no arm64 Widevine CDM exists for Windows. Declaring x86/arm64
        # platforms for directories that do not exist made the package look
        # wider than it is and hid that gap.
        PLAT_COUNT=$(jq '.platforms | length' WidevineCdm/manifest.json)
        PLAT_ARCHS=$(jq -r '[.platforms[].arch] | join(",")' WidevineCdm/manifest.json)
        [ "$PLAT_COUNT" -eq 1 ] && [ "$PLAT_ARCHS" = "x64" ] || {
          echo "  ERROR: manifest must declare exactly one platform (x64), found $PLAT_COUNT: $PLAT_ARCHS"; exit 1; }
        echo "  Platforms: OK (x64 only, matching what is shipped)"
        for d in WidevineCdm/_platform_specific/*; do
          [ -d "$d" ] || continue
          case "$d" in
            */win_x64) ;;
            *) echo "  ERROR: unexpected platform payload $d (only win_x64 is supported)"; exit 1 ;;
          esac
        done

        echo ""
        echo "==> Checking WidevineCdm DLL"
        for dll in WidevineCdm/_platform_specific/*/widevinecdm.dll; do
          if [ -f "$dll" ]; then
            echo "  OK: $dll ($(du -h "$dll" | cut -f1))"
          fi
        done

    - name: Validate registry file
      run: |
        echo "==> Checking debloater.reg"
        # Check header
        head -1 debloater.reg | grep -q "Windows Registry Editor" || { echo "  ERROR: missing reg header"; exit 1; }
        echo "  Header: OK"

        # Check no remaining Chromium references (should all be Helium)
        if grep -i "\\\\Chromium" debloater.reg; then
          echo "  WARNING: found 'Chromium' reference — should be 'Helium'"
        else
          echo "  Policy key: Helium OK"
        fi

        # Count policies
        COUNT=$(grep -c '^"' debloater.reg || true)
        echo "  Policy count: $COUNT"

    - name: Validate chrome++.ini
      run: |
        echo "==> Checking chrome++.ini"
        # Check required sections
        grep -q '^\[general\]' chrome++.ini || { echo "  ERROR: missing [general]"; exit 1; }
        grep -q 'data_dir=' chrome++.ini || { echo "  ERROR: missing data_dir"; exit 1; }
        grep -q 'cache_dir=' chrome++.ini || { echo "  ERROR: missing cache_dir"; exit 1; }
        grep -q 'command_line=' chrome++.ini || { echo "  ERROR: missing command_line"; exit 1; }

        # hibbiki-style layout: %app% = Helium\, so ..\ escapes to the portable
        # root where Data/Cache must live. This check used to reject '..\' —
        # the restructure inverted the requirement (spec section 7).
        grep -qF 'data_dir=%app%\..\Data' chrome++.ini || { echo "  ERROR: data_dir must be %app%\..\Data"; exit 1; }
        grep -qF 'cache_dir=%app%\..\Cache' chrome++.ini || { echo "  ERROR: cache_dir must be %app%\..\Cache"; exit 1; }
        if grep -qF 'data_dir=%app%\Data' chrome++.ini; then
          echo "  ERROR: old flat data_dir=%app%\Data present"
          exit 1
        fi
        grep -qF 'policy_key=Portable' chrome++.ini || { echo "  ERROR: missing policy_key=Portable"; exit 1; }
        echo "  Paths: OK (data/cache at portable root)"

        # issue #10 regression guard: --disable-component-update also disables
        # preinstalled-component registration, which is how Chrome finds the
        # shipped Widevine CDM (Helium\WidevineCdm) — DRM breaks when it is set.
        # Component updates stay off via debloater.reg (ComponentUpdatesEnabled=0).
        if grep '^command_line=' chrome++.ini | grep -q -- '--disable-component-update'; then
          echo "  ERROR: --disable-component-update in command_line breaks Widevine (issue #10)"
          exit 1
        fi
        grep -qF 'ComponentUpdatesEnabled' debloater.reg || { echo "  ERROR: component updates must stay disabled via debloater.reg policy"; exit 1; }
        echo "  issue #10 guard: OK (no --disable-component-update; policy keeps updates off)"

        # issue #9 regression guard: Crashpad lives in
        # <default user data dir>\Crashpad on Windows and ignores --user-data-dir,
        # so chrome++.ini must redirect it into the portable folder.
        grep '^command_line=' chrome++.ini | grep -q -- '--breakpad-dump-location=' || { echo "  ERROR: command_line must set --breakpad-dump-location (Crashpad leaks to AppData)"; exit 1; }
        # The relative dump location alone is not enough: it resolves against the
        # working directory, so a hand-made shortcut can defeat it (issue #9 came
        # back that way). Crashpad must also be stopped from initialising.
        grep '^command_line=' chrome++.ini | grep -q -- '--disable-crash-reporter' || { echo "  ERROR: command_line must set --disable-crash-reporter (relative dump path can be defeated by the working directory)"; exit 1; }
        echo "  issue #9 guard: OK (Crashpad redirected AND not initialised)"

        echo "  command_line: $(grep 'command_line=' chrome++.ini | sed 's/command_line=//')"

    - name: Validate update.bat
      run: |
        echo "==> Checking update.bat"
        # Check version banner exists
        grep -q "Helium Portable Updater" update.bat || echo "  WARNING: version banner not found"

        # Check PowerShell extraction line count
        BATCH_LINES=$(sed -n '1,/^exit \/b$/p' update.bat | wc -l)
        SKIP_NUM=$(grep "Select-Object -Skip" update.bat | grep -oP '\d+')
        echo "  Batch preamble lines: $BATCH_LINES (Skip: $SKIP_NUM)"
        if [ "$BATCH_LINES" != "$SKIP_NUM" ]; then
          echo "  WARNING: Skip count ($SKIP_NUM) doesn't match batch lines ($BATCH_LINES)"
          echo "  The PowerShell extraction may be broken!"
        else
          echo "  Extraction: OK (Skip=$SKIP_NUM matches $BATCH_LINES batch lines)"
        fi

        # Check API URL has per_page
        grep -q "per_page=" update.bat && echo "  API pagination: OK (per_page present)" || echo "  WARNING: missing per_page — may miss releases"

        # Check protected paths
        grep -q "WidevineCdm" update.bat && echo "  WidevineCdm protected: OK" || echo "  WARNING: WidevineCdm not in protected list"

        # Check component update flag
        grep -q "component-update" update.bat && echo "  component-update: OK" || true

        # Check architecture auto-detection
        if grep -q 'PROCESSOR_ARCHITECTURE' update.bat; then
          echo "  Arch detection: OK"
        else
          echo "  WARNING: no architecture auto-detection"
        fi

        # Check arch-aware download URL
        grep -q 'arch.*windows.zip' update.bat && echo "  Arch-aware download: OK" || echo "  WARNING: may only support x64"

    - name: Validate build workflow
      run: |
        echo "==> Checking main.yml"
        # Check matrix strategy for multi-arch
        grep -q "arch:" .github/workflows/main.yml && echo "  Matrix: OK (multi-arch)" || echo "  WARNING: no arch matrix"
        grep -q "arm64" .github/workflows/main.yml && echo "  ARM64 support: OK" || echo "  WARNING: no ARM64"
        grep -q "debloater.reg" .github/workflows/main.yml && echo "  debloater.reg included: OK" || echo "  WARNING: debloater.reg missing from build"

        # Portable-data safety net: build must hard-fail when version.dll is
        # missing AND assert it exists before packaging (issue #7 regression).
        if grep -qF '\\\\App\\\\' .github/workflows/main.yml; then
          echo "  ERROR: broken quadruple-backslash DLL regex found (never matches Windows paths)"
          exit 1
        fi
        echo "  Broken backslash regex: absent OK"

        grep -q 'version\.dll' .github/workflows/main.yml || { echo "  ERROR: main.yml does not reference version.dll"; exit 1; }
        grep -q 'Test-Path "Helium_Portable\\Helium\\version\.dll"' .github/workflows/main.yml || { echo "  ERROR: missing pre-package version.dll assertion in main.yml"; exit 1; }
        grep -q 'exit 1' .github/workflows/main.yml || { echo "  ERROR: main.yml has no hard-fail on missing version.dll"; exit 1; }
        echo "  version.dll selection + assertion + hard-fail: OK"

        # hibbiki-style layout: assembly must target Helium_Portable\Helium\
        # with WidevineCdm at the FLAT Helium\WidevineCdm path — Chrome 154
        # only registers the exe-dir flat location (windows-smoke run 36306584637).
        grep -qF 'Helium_Portable\Helium' .github/workflows/main.yml || { echo "  ERROR: main.yml does not assemble into Helium_Portable\Helium"; exit 1; }
        grep -qF 'Copy-Item WidevineCdm "Helium_Portable\Helium\"' .github/workflows/main.yml || { echo "  ERROR: WidevineCdm not copied to flat Helium\WidevineCdm"; exit 1; }
        # x64-only CDM: the arm64 zip must not carry the x64 module, and the build
        # must refuse to ship an arm64-wide CDM claim (issue: silent DRM gap).
        grep -qF 'if ($arch -eq "x64")' .github/workflows/main.yml || { echo "  ERROR: CDM copy is not architecture-gated"; exit 1; }
        grep -qF 'arm64 package must not contain the x64 Widevine CDM' .github/workflows/main.yml || { echo "  ERROR: missing arm64 CDM assertion in main.yml"; exit 1; }
        echo "  CDM architecture gating: OK (x64 only)"
        # Regression guard: versioned nesting must NOT come back (Chrome ignores it).
        grep -qF '$heliumVer\WidevineCdm' .github/workflows/main.yml && { echo "  ERROR: WidevineCdm nested under version dir — Chrome ignores that path"; exit 1; }
        echo "  hibbiki layout assembly: OK"

        # Unified release scheme: one tag per version, single publish point.
        # (design history lived in docs/superpowers, removed from the repo)
        grep -qF 'TAG="helium-portable_${HELIUM_VER}_${PLUS_VER}"' .github/workflows/main.yml || { echo "  ERROR: check job does not build the unified release tag"; exit 1; }
        grep -qE 'tag_name: helium-portable_\$\{\{' .github/workflows/main.yml || { echo "  ERROR: release job tag_name is not the unified scheme"; exit 1; }
        grep -qF 'upload-artifact@v4' .github/workflows/main.yml || { echo "  ERROR: matrix builds must upload artifacts (no direct publish)"; exit 1; }
        grep -qF 'needs: [check, build]' .github/workflows/main.yml || { echo "  ERROR: release job must gate on both check and build"; exit 1; }
        SOFTPROPS_COUNT=$(grep -c 'action-gh-release' .github/workflows/main.yml || true)
        [ "$SOFTPROPS_COUNT" -eq 1 ] || { echo "  ERROR: expected exactly 1 action-gh-release publish point, found $SOFTPROPS_COUNT"; exit 1; }
        echo "  Unified release scheme: OK"

    - name: Validate root launchers
      run: |
        echo "==> Checking package-root launchers"
        # These files sit next to Helium (not inside it) so the browser can be
        # started or updated without navigating into the browser folder. They must
        # stay portable: relative to their own location, never an absolute path,
        # and the browser launcher must set Helium as the working directory.
        LAUNCHERS=(
          "Helium Browser.bat"
          "Update Helium.bat"
          "Set Default Browser.bat"
          "Apply Debloat Policies.bat"
          "Defender Exclusion.bat"
          "Fix AppData leftovers.bat"
          "Block AppData folder.bat"
          "README-FIRST.txt"
        )
        ALL_OK=true
        for f in "${LAUNCHERS[@]}"; do
          if [ -f "$f" ]; then echo "  OK: $f"; else echo "  MISSING: $f"; ALL_OK=false; fi
        done
        [ "$ALL_OK" = true ] || { echo "  ERROR: root launchers missing"; exit 1; }

        grep -qF 'Helium\chrome.exe' 'Helium Browser.bat' || { echo "  ERROR: browser launcher does not target the Helium chrome.exe"; exit 1; }
        grep -qF 'cd /d "%APP_DIR%Helium"' 'Helium Browser.bat' || { echo "  ERROR: browser launcher must cd into Helium (profile/cache/Crashpad paths are relative to the working directory)"; exit 1; }
        # Launcher-level defences must be absolute, so a shortcut with any working
        # directory behaves the same.
        grep -qF 'set "BREAKPAD_DUMP_LOCATION=%APP_DIR%Data\Crashpad"' 'Helium Browser.bat' || { echo "  ERROR: launcher must set an absolute BREAKPAD_DUMP_LOCATION"; exit 1; }
        grep -qF -- '--breakpad-dump-location="%APP_DIR%Data\Crashpad"' 'Helium Browser.bat' || { echo "  ERROR: launcher must pass an absolute --breakpad-dump-location"; exit 1; }
        grep -qF -- '--disable-crash-reporter' 'Helium Browser.bat' || { echo "  ERROR: launcher must disable the crash reporter"; exit 1; }
        # Last line of defence for issue #9: a child process spawned without our
        # switches still derives its default user data dir from %LOCALAPPDATA%,
        # so the launcher redirects it into the package.
        grep -qF 'set "LOCALAPPDATA=%APP_DIR%Data\Local"' 'Helium Browser.bat' || { echo "  ERROR: launcher must redirect LOCALAPPDATA into the package"; exit 1; }
        grep -qF 'pushd "%APP_DIR%Helium"' 'Update Helium.bat' || { echo "  ERROR: updater launcher must run from Helium (update.bat resolves paths from its own folder)"; exit 1; }
        grep -qF 'reg import' 'Apply Debloat Policies.bat' || { echo "  ERROR: policy launcher does not import debloater.reg"; exit 1; }
        # Optional OS-level hardening for issue #9: deny write access to the
        # vendor folder Chromium falls back to, so any launch path is covered.
        grep -qF 'icacls' 'Block AppData folder.bat' || { echo "  ERROR: Block AppData folder.bat does not apply an ACL"; exit 1; }
        grep -qF '/deny' 'Block AppData folder.bat' || { echo "  ERROR: Block AppData folder.bat does not deny write access"; exit 1; }
        grep -qF '/reset' 'Block AppData folder.bat' || { echo "  ERROR: Block AppData folder.bat must be reversible"; exit 1; }
        grep -qF 'call bypass_windows_defender.bat "%APP_DIR%"' 'Defender Exclusion.bat' || { echo "  ERROR: Defender launcher must exclude the package root, not Helium"; exit 1; }
        for f in 'Helium Browser.bat' 'Update Helium.bat' 'Set Default Browser.bat' 'Apply Debloat Policies.bat' 'Defender Exclusion.bat' 'Fix AppData leftovers.bat' 'Block AppData folder.bat'; do
          # Strip CR first (CRLF files) and match a real drive path only
          # (letter + colon + slash). A loose [A-Z]: pattern also matches
          # innocent text such as 'echo ERROR: ...'.
          if tr -d '\r' < "$f" | grep -qE '[A-Za-z]:[\\/]'; then
            echo "  ERROR: $f contains an absolute drive path (not portable)"; exit 1
          fi
        done
        for f in "${LAUNCHERS[@]}"; do
          grep -qF "$f" .github/workflows/main.yml || { echo "  ERROR: main.yml does not ship $f"; exit 1; }
        done
        echo "  Root launchers: OK (portable, correct targets, shipped)"

    - name: Validate smoke workflow (issue #9 / #10 evidence pins)
      run: |
        echo "==> Checking windows-smoke.yml"
        SMOKE=.github/workflows/windows-smoke.yml
        # issue #9 / #10: the smoke run must exercise the portable-launch Crashpad
        # check and the Widevine robustness matrix, otherwise the fixes have no
        # end-to-end evidence and a regression cannot be distinguished from a
        # flaky run.
        grep -qF 'PROBE_ROB_B64' "$SMOKE" || { echo "  ERROR: missing robustness-matrix probe env (L1/L3 evidence)"; exit 1; }
        grep -qF 'Phase C — Crashpad location matrix' "$SMOKE" || { echo "  ERROR: missing Crashpad phase (issue #9 evidence)"; exit 1; }
        grep -qF 'Phase E — arm64 archive layout' "$SMOKE" || { echo "  ERROR: missing arm64 archive phase (no-CDM pin)"; exit 1; }
        grep -qF -e '--breakpad-dump-location' "$SMOKE" || { echo "  ERROR: Crashpad phase does not pin the fix flag"; exit 1; }
        grep -qF -e '--disable-crash-reporter' "$SMOKE" || { echo "  ERROR: smoke run does not exercise --disable-crash-reporter"; exit 1; }
        grep -qF -e '--disable-component-update' "$SMOKE" || { echo "  ERROR: smoke run does not assert the issue #10 flag is absent"; exit 1; }
        echo "  smoke evidence pins: OK"

    - name: Validate file structure
      run: |
        echo "==> Checking required files"
        REQUIRED=(
          "chrome++.ini"
          "bypass_windows_defender.bat"
          "Helium Browser.bat"
          "Update Helium.bat"
          "README-FIRST.txt"
          "debloater.reg"
          "default-apps-multi-profile.bat"
          "update.bat"
          "README.md"
          "WidevineCdm/manifest.json"
          "scripts/migrate-unified-releases.sh"
          ".github/workflows/main.yml"
          ".github/workflows/validate.yml"
          ".github/workflows/windows-smoke.yml"
        )
        ALL_OK=true
        for f in "${REQUIRED[@]}"; do
          if [ -f "$f" ] || [ -d "$f" ]; then
            echo "  OK: $f"
          else
            echo "  MISSING: $f"
            ALL_OK=false
          fi
        done
        [ "$ALL_OK" = true ] || { echo "Some required files are missing!"; exit 1; }
