name: "Windows Smoke (issue #5 update flow + Widevine)"

# Purpose: verify issue #5 (update.bat does not update WidevineCdm) on a real
# Windows runner without manual testing, and answer the layout spec's open risk
# "versioned Widevine path not honored by Helium".
#
# Phase A (fresh install): download the newest unified release zip, assert the
# portable layout (versioned Widevine, version.dll), then launch Helium headless
# with an EME probe page (navigator.requestMediaKeySystemAccess for
# com.widevine.alpha). Hard-fails if the CDM does not resolve on a fresh zip.
#
# Phase B (update flow): simulate an older install (version marker 0.0.0.0),
# run the real update.bat end-to-end (stdin-fed), then check: version bump,
# protected files unchanged, whether Helium/<upstream-version>/WidevineCdm was
# created, and re-run the EME probe. If the CDM stops resolving, the #5 gap is
# CONFIRMED (workflow fails and the summary says so); if it still resolves,
# #5 is NOT REPRODUCIBLE (workflow passes with evidence to close the issue).
# Fallback probe: flat Helium/WidevineCdm is copied in only when Phase B's EME
# fails, to validate the documented flat-fallback contingency.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROBE_B64: 

    steps:
      - name: Resolve latest unified release
        id: rel
        run: |
          # runner context is not available in job-level env; export at runtime.
          $env:SMOKE = Join-Path $env:RUNNER_TEMP 'smoke'
          "SMOKE=$env:SMOKE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $r = Invoke-RestMethod -Headers $h "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          if ($r.tag_name -notmatch '^helium-portable_\d') { throw "latest release is not a unified tag: $($r.tag_name)" }
          $asset = $r.assets | Where-Object { $_.name -match '^helium-portable-x64_.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "no x64 zip asset on $($r.tag_name)" }
          $ver = ($r.tag_name -replace '^helium-portable_', '').Split('_')[0]
          @{
            tag = $r.tag_name
            ver = $ver
            url = $asset.browser_download_url
          }.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          New-Item -ItemType Directory -Force $env:SMOKE | Out-Null
          "Baseline release: $($r.tag_name) (Helium $ver)" | Set-Content -Encoding utf8 "$env:SMOKE/summary.md"

      - name: Prepare EME probe page + helper
        run: |
          [IO.File]::WriteAllBytes("$env:SMOKE/probe.html", [Convert]::FromBase64String($env:PROBE_B64))
          $helper = @'
          param([string]$App, [string]$Profile, [string]$Log, [string]$Probe, [string]$Label)
          $exe = Join-Path $App 'chrome.exe'
          $uri = 'file:///' + ($Probe -replace '\\', '/')
          function Invoke-Dump([string[]]$argList, [string]$tag) {
            $out = "$env:SMOKE/dump-$tag-out.txt"; $err = "$env:SMOKE/dump-$tag-err.txt"
            try {
              $p = Start-Process -FilePath $exe -ArgumentList $argList -PassThru -NoNewWindow `
                -RedirectStandardOutput $out -RedirectStandardError $err
              if (-not $p.WaitForExit(60000)) { $p.Kill($true); $p.WaitForExit(5000) }
            } catch {
              return @{ exit = -999; out = "START_FAILED: $($_.Exception.Message)" }
            }
            Stop-Process -Name chrome -Force -ErrorAction SilentlyContinue
            $o = ''
            if (Test-Path $out) { $o = Get-Content $out -Raw }
            if ($null -eq $o) { $o = '' }
            $ec = 'killed'; if ($p.HasExited) { $ec = $p.ExitCode }
            return @{ exit = $ec; out = $o }
          }
          $base = @('--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check',
                    '--disable-crash-reporter',"--user-data-dir=$Profile",'--enable-logging=stderr','--v=1')
          $r = Invoke-Dump ($base + @('--virtual-time-budget=12000','--dump-dom',$uri)) "$Label-1"
          $dom = $r.out
          $ec = $r.exit
          Set-Content -Encoding utf8 $Log $dom
          $eme = 'NO_RESULT'
          if ($dom -match 'CDM_OK') { $eme = 'CDM_OK' }
          elseif ($dom -match 'CDM_FAIL:[^<]+') { $eme = $Matches[0] }
          elseif ($dom -match 'CDM_THROW:\w+') { $eme = $Matches[0] }
          if ($eme -eq 'NO_RESULT') {
            $r = Invoke-Dump ($base + @('--virtual-time-budget=40000','--dump-dom',$uri)) "$Label-2"
            $dom = $r.out; $ec = $r.exit
            Add-Content -Encoding utf8 $Log $dom
            if ($dom -match 'CDM_OK') { $eme = 'CDM_OK' }
            elseif ($dom -match 'CDM_FAIL:[^<]+') { $eme = $Matches[0] }
            elseif ($dom -match 'CDM_THROW:\w+') { $eme = $Matches[0] }
          }
          # chrome://components disambiguates "headless denies EME" from "CDM not found".
          $comp = 'NO_DATA'; $ec2 = -1; $wvLines = ''
          $r2 = Invoke-Dump ($base + @('--virtual-time-budget=8000','--dump-dom','chrome://components/')) "$Label-comp"
          $ec2 = $r2.exit
          $cdom = $r2.out
          Set-Content -Encoding utf8 ($Log -replace '\.log$', '-components.log') $cdom
          if ($cdom -match '(?s)WidevineCdm.{0,800}?(\d+\.\d+\.\d+\.\d+)') { $comp = $Matches[1] }
          elseif ($cdom -match '(?s)Widevine Content Decryption Module.{0,600}?(Not Found|Failed to[^<]*|0\.0\.0\.0)') { $comp = 'NOT_FOUND' }
          $wvLines = (($cdom -split "`n" | Where-Object { $_ -match 'widevine|Widevine' } | Select-Object -First 4) -join ' || ')
          if ($wvLines.Length -gt 400) { $wvLines = $wvLines.Substring(0,400) }
          # Diagnostics to summary.
          $head = ''
          if ($dom.Length -gt 0) { $head = ($dom -replace '\s+', ' '); if ($head.Length -gt 400) { $head = $head.Substring(0,400) } }
          "[$Label] chrome exit=$ec; domLength=$($dom.Length); domHead=[$head]" | Add-Content "$env:SMOKE/summary.md"
          "[$Label] components exit=$ec2; component=$comp; widevineLines=[$wvLines]" | Add-Content "$env:SMOKE/summary.md"
          return "eme=$eme; component=$comp"
          '@
          Set-Content -Encoding utf8 "$env:SMOKE/run-probe.ps1" $helper
          if (-not ((Get-Content "$env:SMOKE/probe.html" -Raw) -match 'requestMediaKeySystemAccess')) { throw "probe.html decode failed" }
          "Probe prepared." | Add-Content "$env:SMOKE/summary.md"

      - name: Phase A — download, layout asserts, EME probe (fresh install)
        id: phaseA
        run: |
          $fail = [System.Collections.Generic.List[string]]::new()
          function Assert([bool]$cond, [string]$msg) {
            if ($cond) { "PASS: $msg" | Add-Content "$env:SMOKE/summary.md" }
            else { "FAIL: $msg" | Add-Content "$env:SMOKE/summary.md"; $script:fail.Add($msg) }
          }
          Invoke-WebRequest -Uri '${{ steps.rel.outputs.url }}' -OutFile "$env:SMOKE/rel.zip"
          Expand-Archive -Path "$env:SMOKE/rel.zip" -DestinationPath "$env:SMOKE/fresh" -Force
          $app = "$env:SMOKE/fresh/Helium_Portable/Helium"
          $ver = '${{ steps.rel.outputs.ver }}'

          Assert (Test-Path "$app/chrome.exe") "fresh: chrome.exe present"
          Assert (Test-Path "$app/version.dll") "fresh: version.dll present (issue #7)"
          Assert ((Get-Content "$app/version.txt" -Raw).Trim() -eq $ver) "fresh: version.txt == $ver"
          Assert (Test-Path "$app/$ver/WidevineCdm/manifest.json") "fresh: versioned WidevineCdm present (layout)"
          Assert (-not (Test-Path "$app/WidevineCdm")) "fresh: no flat WidevineCdm (layout)"
          "chrome.exe ProductVersion: $((Get-Item "$app/chrome.exe").VersionInfo.ProductVersion); size=$((Get-Item "$app/chrome.exe").Length)" | Add-Content "$env:SMOKE/summary.md"
          # Environment diagnostics: capture chrome output via STARTUPINFO redirection
          # (bypasses pwsh pipelines) across variants.
          function Invoke-Chrome([string]$tag, [string[]]$extra, [string]$app) {
            $out = "$env:SMOKE/san-$tag-out.txt"; $err = "$env:SMOKE/san-$tag-err.txt"
            $prof = "$env:SMOKE/profileSanity-$tag"
            $argList = $extra + @('--disable-gpu','--no-first-run','--no-default-browser-check',"--user-data-dir=$prof",'--dump-dom','about:blank')
            try {
              $p = Start-Process -FilePath "$app/chrome.exe" -ArgumentList $argList -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
              if (-not $p.WaitForExit(45000)) { $p.Kill($true); $p.WaitForExit(5000); "diag[$tag]: TIMEOUT after 45s, killed" | Add-Content "$env:SMOKE/summary.md" }
            } catch { "diag[$tag]: START_FAILED $($_.Exception.Message)" | Add-Content "$env:SMOKE/summary.md"; return $false }
            $oText = ''; if (Test-Path $out) { $oText = Get-Content $out -Raw }; if ($null -eq $oText) { $oText = '' }
            $eText = ''; if (Test-Path $err) { $eText = Get-Content $err -Raw }; if ($null -eq $eText) { $eText = '' }
            $oHead = ($oText -replace '\s+', ' '); if ($oHead.Length -gt 150) { $oHead = $oHead.Substring(0, 150) }
            $eHead = ($eText -replace '\s+', ' '); if ($eHead.Length -gt 200) { $eHead = $eHead.Substring(0, 200) }
            $exitCode = 'killed'; if ($p.HasExited) { $exitCode = $p.ExitCode }
            "diag[$tag]: exit=$exitCode; outLen=$($oText.Length); errLen=$($eText.Length); out=[$oHead]; err=[$eHead]" | Add-Content "$env:SMOKE/summary.md"
            return ($oText.Length -gt 0)
          }
          "chrome dir: $((Get-ChildItem $app -File | Sort-Object Length -Descending | Select-Object -First 8 | ForEach-Object { $_.Name + '=' + $_.Length }) -join ', ')" | Add-Content "$env:SMOKE/summary.md"
          $gotOutput = Invoke-Chrome 'headlessnew' @('--headless=new') $app
          if (-not $gotOutput) { $gotOutput = Invoke-Chrome 'headless' @('--headless') $app }
          if (-not $gotOutput) { $null = Invoke-Chrome 'headed' @() $app }
          if (-not $gotOutput -and (Test-Path "$app/version.dll")) {
            Move-Item "$app/version.dll" "$app/version.dll.bak" -Force
            $gotOutput = Invoke-Chrome 'noversiondll' @('--headless=new') $app
            Move-Item "$app/version.dll.bak" "$app/version.dll" -Force
            "diag: version.dll temporarily removed for noversiondll run; restored=$(Test-Path "$app/version.dll")" | Add-Content "$env:SMOKE/summary.md"
          }
          $sanProf = Get-ChildItem "$env:SMOKE" -Directory -Filter 'profileSanity*' | Select-Object -First 1
          if ($sanProf) {
            $files = Get-ChildItem $sanProf.FullName -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 12
            "diag[profile]: $($files.Count) files: $(($files | ForEach-Object { $_.Name }) -join ', ')" | Add-Content "$env:SMOKE/summary.md"
          }
          Stop-Process -Name chrome -Force -ErrorAction SilentlyContinue

          $eme = & "$env:SMOKE/run-probe.ps1" -App $app -Profile "$env:SMOKE/profileA" -Log "$env:SMOKE/emeA.log" -Probe "$env:SMOKE/probe.html" -Label "A-fresh"
          "emeA=$eme" | Set-Content "$env:SMOKE/emeA.txt"
          "Phase A EME: $eme" | Add-Content "$env:SMOKE/summary.md"

          if ($fail.Count -gt 0) {
            throw "Phase A failed: $($fail -join '; ')"
          }

      - name: Phase B — simulate old install + run real update.bat
        id: phaseB
        run: |
          $fail = [System.Collections.Generic.List[string]]::new()
          function Assert([bool]$cond, [string]$msg) {
            if ($cond) { "PASS: $msg" | Add-Content "$env:SMOKE/summary.md" }
            else { "FAIL: $msg" | Add-Content "$env:SMOKE/summary.md"; $script:fail.Add($msg) }
          }
          $app = "$env:SMOKE/fresh/Helium_Portable/Helium"
          $ver = '${{ steps.rel.outputs.ver }}'

          # Simulate an older install: rename the versioned CDM dir + marker.
          Move-Item "$app/$ver" "$app/0.0.0.0"
          Set-Content "$app/version.txt" "0.0.0.0"
          $protected = 'chrome++.ini','update.bat','debloater.reg','default-apps-multi-profile.bat','bypass_windows_defender.bat'
          foreach ($f in $protected) { (Get-FileHash "$app/$f").Hash + ' ' + $f | Add-Content "$env:SMOKE/hashes-before.txt" }

          "" | Add-Content "$env:SMOKE/summary.md"
          "## Update flow (version.txt forced to 0.0.0.0)" | Add-Content "$env:SMOKE/summary.md"

          # Upstream latest, for post-update expectations.
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $up = Invoke-RestMethod -Headers $h "https://api.github.com/repos/imputnet/helium-windows/releases?per_page=10"
          $expected = ($up | Where-Object { -not $_.prerelease } | Select-Object -First 1).tag_name
          "Upstream latest: $expected" | Add-Content "$env:SMOKE/summary.md"
          $expected | Set-Content "$env:SMOKE/expected.txt"

          # Run the real update.bat; stdin feeds both Read-Host prompts.
          $bat = "$app/update.bat"
          if (-not (Test-Path $bat)) { throw "update.bat missing from zip" }
          "Running update.bat (piped 'y')..." | Add-Content "$env:SMOKE/summary.md"
          $batDir = $app
          Push-Location $batDir
          try {
            $p = Start-Process -FilePath "$env:ComSpec" -ArgumentList '/c','echo y| update.bat' -WorkingDirectory $batDir -Wait -PassThru -NoNewWindow
            "update.bat exit code: $($p.ExitCode)" | Add-Content "$env:SMOKE/summary.md"
          } finally { Pop-Location }

          # Post-update asserts.
          $newV = (Get-Content "$app/version.txt" -Raw).Trim()
          Assert ($newV -eq $expected) "update: version.txt bumped to upstream latest ($newV == $expected)"
          $protectedOk = $true
          foreach ($line in (Get-Content "$env:SMOKE/hashes-before.txt")) {
            $parts = $line -split ' ', 2
            if ((Get-FileHash "$app/$($parts[1])").Hash -ne $parts[0]) {
              $protectedOk = $false
              "FAIL: protected file changed: $($parts[1])" | Add-Content "$env:SMOKE/summary.md"
              $fail.Add("protected changed: $($parts[1])")
            }
          }
          Assert $protectedOk "update: protected files unchanged (ini/bats)"
          Assert (Test-Path "$app/chrome.exe") "update: chrome.exe still present"

          $newCdm = Test-Path "$app/$newV/WidevineCdm/manifest.json"
          $oldCdm = Test-Path "$app/0.0.0.0/WidevineCdm/manifest.json"
          $line = if ($newCdm) { "YES" } else { "NO — upstream zip ships no WidevineCdm, update.bat does not carry it over (expected #5 gap)" }
          "update: Helium/$newV/WidevineCdm created by update.bat: $line" | Add-Content "$env:SMOKE/summary.md"
          Assert $oldCdm "update: old versioned CDM dir preserved (not deleted)"

          # EME probe after the update.
          $eme = & "$env:SMOKE/run-probe.ps1" -App $app -Profile "$env:SMOKE/profileB" -Log "$env:SMOKE/emeB.log" -Probe "$env:SMOKE/probe.html" -Label "B-postupdate"
          "emeB=$eme" | Set-Content "$env:SMOKE/emeB.txt"
          "Phase B EME: $eme" | Add-Content "$env:SMOKE/summary.md"

          # Contingency: flat fallback (spec's documented mitigation) — only if B's EME failed.
          if ($eme -notmatch 'eme=CDM_OK' -and (Test-Path "$app/0.0.0.0/WidevineCdm")) {
            Copy-Item "$app/0.0.0.0/WidevineCdm" "$app/WidevineCdm" -Recurse -Force
            "Flat fallback: copied 0.0.0.0/WidevineCdm -> Helium/WidevineCdm, re-probing..." | Add-Content "$env:SMOKE/summary.md"
            $eme3 = & "$env:SMOKE/run-probe.ps1" -App $app -Profile "$env:SMOKE/profileC" -Log "$env:SMOKE/emeC.log" -Probe "$env:SMOKE/probe.html" -Label "C-flatfallback"
            "emeC=$eme3" | Set-Content "$env:SMOKE/emeC.txt"
            "Flat fallback EME: $eme3" | Add-Content "$env:SMOKE/summary.md"
          }

          if ($fail.Count -gt 0) { throw "Phase B failed: $($fail -join '; ')" }

      - name: "Verdict — issue #5 resolved or confirmed"
        if: always()
        run: |
          $summary = "$env:SMOKE/summary.md"
          function Read-Result([string]$path) {
            if (-not (Test-Path $path)) { return @{ eme = 'MISSING'; comp = 'MISSING' } }
            $raw = (Get-Content $path -Raw).Trim()
            $eme = if ($raw -match 'eme=([^;]+)') { $Matches[1].Trim() } else { 'MISSING' }
            $comp = if ($raw -match 'component=(.+)$') { $Matches[1].Trim() } else { 'MISSING' }
            return @{ eme = $eme; comp = $comp }
          }
          function Test-Comp([string]$c) { return $c -match '^\d+\.\d+\.\d+\.\d+$' -and $c -ne '0.0.0.0' }
          $A = Read-Result "$env:SMOKE/emeA.txt"
          $B = Read-Result "$env:SMOKE/emeB.txt"
          $C = if (Test-Path "$env:SMOKE/emeC.txt") { Read-Result "$env:SMOKE/emeC.txt" } else { $null }
          $fails = @()

          "" | Add-Content $summary
          "## Probe results" | Add-Content $summary
          "- fresh install: EME=$($A.eme); component=$($A.comp)" | Add-Content $summary
          "- after update.bat: EME=$($B.eme); component=$($B.comp)" | Add-Content $summary
          if ($C) { "- flat fallback: EME=$($C.eme); component=$($C.comp)" | Add-Content $summary }

          if ($A.eme -ne 'CDM_OK') {
            "" | Add-Content $summary
            "Widevine/CDM log lines (fresh install):" | Add-Content $summary
            if (Test-Path "$env:SMOKE/emeA.log") {
              Select-String -Path "$env:SMOKE/emeA.log" -Pattern 'widevine|cdm' -CaseSensitive:$false |
                Select-Object -First 15 | ForEach-Object { "- $($_.Line.Trim())" } | Add-Content $summary
            }
          }

          "" | Add-Content $summary
          "## Verdict" | Add-Content $summary
          $emeAok = $A.eme -eq 'CDM_OK'
          $emeBok = $B.eme -eq 'CDM_OK'
          $compAok = Test-Comp $A.comp
          $compBok = Test-Comp $B.comp

          if ($emeAok -and $emeBok) {
            "**#5 NOT REPRODUCIBLE** — EME resolves on the fresh zip and after a real update.bat version bump. Evidence to close #5." | Add-Content $summary
          } elseif ($emeAok -and -not $emeBok) {
            $fails += "#5 CONFIRMED (EME): fresh=CDM_OK, post-update=$($B.eme)"
            "**#5 CONFIRMED (EME)** — fresh install resolves the CDM, post-update does not ($($B.eme)). Component after update: $($B.comp). Versioned dir was not recreated by update.bat." | Add-Content $summary
            if ($C) { "Flat fallback result: $($C.eme) (mitigation direction for the fix)." | Add-Content $summary }
          } elseif (-not $emeAok -and $compAok -and $compBok) {
            "**#5 NOT REPRODUCED (component-level)** — headless EME unavailable (fresh EME=$($A.eme)), but chrome://components registers the CDM before ($($A.comp)) and after ($($B.comp)) the update. EME itself could not be verified in this environment." | Add-Content $summary
          } elseif (-not $emeAok -and $compAok -and -not $compBok) {
            $fails += "#5 CONFIRMED (component): CDM registered before update ($($A.comp)) but lost after update (component=$($B.comp))"
            "**#5 CONFIRMED (component-level)** — CDM registered before the update ($($A.comp)) but chrome no longer sees it after update.bat (component=$($B.comp))." | Add-Content $summary
            if ($C) { "Flat fallback result: $($C.eme) / $($C.comp)." | Add-Content $summary }
          } elseif (-not $emeAok -and -not $compAok) {
            $fails += "fresh zip never registers the CDM (EME=$($A.eme), component=$($A.comp))"
            "**SPEC RISK CONFIRMED** — on the fresh zip chrome.exe does not register the versioned CDM at all (EME=$($A.eme), component=$($A.comp)): versioned Widevine path not honored, or this headless environment cannot load Widevine. See log lines above." | Add-Content $summary
          } else {
            $fails += "inconclusive: fresh EME=$($A.eme) comp=$($A.comp); post EME=$($B.eme) comp=$($B.comp)"
            "**INCONCLUSIVE** — results do not fit a decision rule; inspect probe results above." | Add-Content $summary
          }

          "" | Add-Content $summary
          if ($fails.Count -gt 0) { "**Result: FAILED**" | Add-Content $summary }
          else { "**Result: PASSED**" | Add-Content $summary }

          Get-Content $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Write-Host
          "=========== windows-smoke summary ==========" | Write-Host
          Get-Content $summary | Write-Host
          "============================================" | Write-Host
          if ($fails.Count -gt 0) { $fails | ForEach-Object { "FAIL: $_" | Write-Host }; exit 1 }
