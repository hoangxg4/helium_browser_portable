name: "Windows Smoke (issue #5 update flow + Widevine)"

# Purpose: verify issue #5 (update.bat does not update WidevineCdm) on a real
# Windows runner without manual testing. History: run 36306584637 proved that
# Chrome 154 only registers the FLAT Helium\WidevineCdm path (versioned and
# chrome-ver dirs both fail), so the build now ships flat and update.bat
# migrates legacy nested installs.
#
# Phase A (fresh install): download the newest unified release zip, assert the
# portable layout (FLAT WidevineCdm next to chrome.exe, version.dll), then
# launch Helium headless with an EME probe page
# (navigator.requestMediaKeySystemAccess for com.widevine.alpha). Hard-fails
# if the CDM does not resolve on a fresh zip. If it does not, a path matrix
# (versioned dir, chrome internal dir) runs to separate a layout regression
# from an environment limitation.
#
# Phase B (update flow): simulate a PRE-FIX install (version marker 0.0.0.0,
# CDM nested under a versioned dir, no flat CDM), run the real update.bat
# end-to-end (stdin-fed), then check: version bump, protected files unchanged,
# update.bat migrated the nested CDM to the flat path, and re-run the EME
# probe. Green end-to-end = evidence to close #5; any loss of the CDM = #5
# CONFIRMED (workflow fails and the summary says so).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROBE_B64: 
      # EME robustness-matrix probe: asks com.widevine.alpha once per
      # robustness level and prints LEVEL=OK/LEVEL=ErrorName pairs, so the
      # key-system half of the "L1 vs L3" question is measurable on a real
      # Chrome build (an L3-only CDM answers SW_* and rejects HW_*).
      PROBE_ROB_B64: 

    steps:
      - name: Resolve latest unified release
        id: rel
        run: |
          # runner context is not available in job-level env; export at runtime.
          $env:SMOKE = Join-Path $env:RUNNER_TEMP 'smoke'
          "SMOKE=$env:SMOKE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $r = Invoke-RestMethod -Headers $h "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          if ($r.tag_name -notmatch '^helium-portable_\d') { throw "latest release is not a unified tag: $($r.tag_name)" }
          $asset = $r.assets | Where-Object { $_.name -match '^helium-portable-x64_.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "no x64 zip asset on $($r.tag_name)" }
          $ver = ($r.tag_name -replace '^helium-portable_', '').Split('_')[0]
          @{
            tag = $r.tag_name
            ver = $ver
            url = $asset.browser_download_url
          }.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          New-Item -ItemType Directory -Force $env:SMOKE | Out-Null
          "SMOKE_LATEST_TAG=$($r.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SMOKE_LATEST_PUB=$($r.published_at)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Baseline release: $($r.tag_name) (Helium $ver), published $($r.published_at)" | Set-Content -Encoding utf8 "$env:SMOKE/summary.md"

      - name: Prepare EME probe page + helper
        run: |
          [IO.File]::WriteAllBytes("$env:SMOKE/probe.html", [Convert]::FromBase64String($env:PROBE_B64))
          [IO.File]::WriteAllBytes("$env:SMOKE/probe-rob.html", [Convert]::FromBase64String($env:PROBE_ROB_B64))
          $helper = @'
          param([string]$App, [string]$Profile, [string]$Log, [string]$Probe, [string]$Label)
          $exe = Join-Path $App 'chrome.exe'
          $uri = 'file:///' + ($Probe -replace '\\', '/')
          function Invoke-Dump([string[]]$argList, [string]$tag) {
            $out = "$env:SMOKE/dump-$tag-out.txt"; $err = "$env:SMOKE/dump-$tag-err.txt"
            try {
              $p = Start-Process -FilePath $exe -ArgumentList $argList -PassThru -NoNewWindow `
                -RedirectStandardOutput $out -RedirectStandardError $err
              if (-not $p.WaitForExit(60000)) { $p.Kill($true); $p.WaitForExit(5000) }
            } catch {
              return @{ exit = -999; out = "START_FAILED: $($_.Exception.Message)" }
            }
            Stop-Process -Name chrome -Force -ErrorAction SilentlyContinue
            $o = ''
            if (Test-Path $out) { $o = Get-Content $out -Raw }
            if ($null -eq $o) { $o = '' }
            $ec = 'killed'; if ($p.HasExited) { $ec = $p.ExitCode }
            return @{ exit = $ec; out = $o }
          }
          $base = @('--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check',
                    '--disable-crash-reporter',"--user-data-dir=$Profile",'--enable-logging=stderr','--v=1')
          $r = Invoke-Dump ($base + @('--virtual-time-budget=12000','--dump-dom',$uri)) "$Label-1"
          $dom = $r.out
          $ec = $r.exit
          Set-Content -Encoding utf8 $Log $dom
          # Parse ONLY the rendered result (the page source contains 'CDM_OK' literals).
          function Get-Eme([string]$text) {
            if ($text -match '<title>CDM_OK</title>') { return 'CDM_OK' }
            if ($text -match '(?s)<pre id="o">([^<]+)</pre>') {
              $pre = $Matches[1].Trim()
              if ($pre -ne 'pending' -and $pre -ne '') { return $pre }
            }
            return 'NO_RESULT'
          }
          $eme = Get-Eme $dom
          if ($eme -eq 'NO_RESULT') {
            $r = Invoke-Dump ($base + @('--virtual-time-budget=40000','--dump-dom',$uri)) "$Label-2"
            $dom = $r.out; $ec = $r.exit
            Add-Content -Encoding utf8 $Log $dom
            $eme = Get-Eme $dom
          }
          # chrome://components disambiguates "headless denies EME" from "CDM not found".
          $comp = 'NO_DATA'; $ec2 = -1; $wvLines = ''
          $r2 = Invoke-Dump ($base + @('--virtual-time-budget=15000','--dump-dom','chrome://components/')) "$Label-comp"
          $ec2 = $r2.exit
          $cdom = $r2.out
          Set-Content -Encoding utf8 ($Log -replace '\.log$', '-components.log') $cdom
          if ($cdom -match '(?s)WidevineCdm.{0,800}?(\d+\.\d+\.\d+\.\d+)') { $comp = $Matches[1] }
          elseif ($cdom -match '(?s)Widevine Content Decryption Module.{0,600}?(Not Found|Failed to[^<]*|0\.0\.0\.0)') { $comp = 'NOT_FOUND' }
          $wvLines = (($cdom -split "`n" | Where-Object { $_ -match 'widevine|Widevine' } | Select-Object -First 4) -join ' || ')
          if ($wvLines.Length -gt 400) { $wvLines = $wvLines.Substring(0,400) }
          # Diagnostics to summary.
          $head = ''
          if ($dom.Length -gt 0) { $head = ($dom -replace '\s+', ' '); if ($head.Length -gt 400) { $head = $head.Substring(0,400) } }
          $cHead = ''
          if ($cdom.Length -gt 0) { $cHead = ($cdom -replace '\s+', ' '); if ($cHead.Length -gt 300) { $cHead = $cHead.Substring(0,300) } }
          "[$Label] chrome exit=$ec; domLength=$($dom.Length); domHead=[$head]" | Add-Content "$env:SMOKE/summary.md"
          "[$Label] components exit=$ec2; component=$comp; domLen=$($cdom.Length); head=[$cHead]" | Add-Content "$env:SMOKE/summary.md"
          return "eme=$eme; component=$comp"
          '@
          Set-Content -Encoding utf8 "$env:SMOKE/run-probe.ps1" $helper
          if (-not ((Get-Content "$env:SMOKE/probe.html" -Raw) -match 'requestMediaKeySystemAccess')) { throw "probe.html decode failed" }
          if (-not ((Get-Content "$env:SMOKE/probe-rob.html" -Raw) -match 'SW_SECURE_DECODE')) { throw "probe-rob.html decode failed" }
          "Probe prepared." | Add-Content "$env:SMOKE/summary.md"

      - name: Phase A — download, layout asserts, EME probe (fresh install)
        id: phaseA
        run: |
          $fail = [System.Collections.Generic.List[string]]::new()
          function Assert([bool]$cond, [string]$msg) {
            if ($cond) { "PASS: $msg" | Add-Content "$env:SMOKE/summary.md" }
            else { "FAIL: $msg" | Add-Content "$env:SMOKE/summary.md"; $script:fail.Add($msg) }
          }
          Invoke-WebRequest -Uri '${{ steps.rel.outputs.url }}' -OutFile "$env:SMOKE/rel.zip"
          Expand-Archive -Path "$env:SMOKE/rel.zip" -DestinationPath "$env:SMOKE/fresh" -Force
          $app = "$env:SMOKE/fresh/Helium_Portable/Helium"
          $ver = '${{ steps.rel.outputs.ver }}'

          Assert (Test-Path "$app/chrome.exe") "fresh: chrome.exe present"
          Assert (Test-Path "$app/version.dll") "fresh: version.dll present (issue #7)"
          Assert ((Get-Content "$app/version.txt" -Raw).Trim() -eq $ver) "fresh: version.txt == $ver"
          Assert (Test-Path "$app/WidevineCdm/manifest.json") "fresh: flat WidevineCdm present (layout)"
          # Package-root launchers (x64 build must ship them; the browser itself
          # stays in Helium\ because Chrome++ requires that).
          $rootDir = "$env:SMOKE/fresh/Helium_Portable"
          foreach ($rf in 'Helium Browser.bat','Update Helium.bat','Set Default Browser.bat','Apply Debloat Policies.bat','Defender Exclusion.bat','README-FIRST.txt') {
            Assert (Test-Path (Join-Path $rootDir $rf)) "fresh: root launcher present: $rf"
          }
          $browserBat = Get-Content (Join-Path $rootDir 'Helium Browser.bat') -Raw
          Assert ($browserBat -match 'Helium\\chrome.exe') "fresh: browser launcher targets Helium\chrome.exe"
          Assert ($browserBat -match 'cd /d "%APP_DIR%Helium"') "fresh: browser launcher sets Helium\ as working directory"
          Assert ($browserBat -match 'BREAKPAD_DUMP_LOCATION=%APP_DIR%Data') "fresh: browser launcher sets an absolute BREAKPAD_DUMP_LOCATION"
          Assert ($browserBat -match '--disable-crash-reporter') "fresh: browser launcher disables the crash reporter"
          Assert (Test-Path (Join-Path $rootDir 'Fix AppData leftovers.bat')) "fresh: AppData cleanup script present"
          # Artifact freshness: this workflow downloads the published release, so a
          # run fired in parallel with a build would silently test the PREVIOUS
          # zip (that produced three false FAILs on 2026-11-02). Record what was
          # actually tested so a stale asset is obvious in the summary.
          "artifact under test: $env:SMOKE_LATEST_TAG (published $env:SMOKE_LATEST_PUB)" | Add-Content "$env:SMOKE/summary.md"
          Assert (-not (Test-Path "$app/$ver/WidevineCdm")) "fresh: no versioned WidevineCdm (layout — Chrome ignores it)"
          "chrome.exe ProductVersion: $((Get-Item "$app/chrome.exe").VersionInfo.ProductVersion); size=$((Get-Item "$app/chrome.exe").Length)" | Add-Content "$env:SMOKE/summary.md"
          # Chrome++ version.dll (issue #7 artifact) hijacks app-local version.dll and
          # suppresses --dump-dom output entirely on CI (verified: exit=0, 0 bytes with
          # it present; normal output without it). Real users never use --dump-dom, and
          # Chrome++ portable-mode behavior is not under test — move it aside for probes.
          Move-Item "$app/version.dll" "$app/version.dll.hidden" -Force
          "NOTE: version.dll moved aside for probing (Chrome++ portable loader silences --dump-dom on CI; see workflow history run #4)" | Add-Content "$env:SMOKE/summary.md"

          $eme = & "$env:SMOKE/run-probe.ps1" -App $app -Profile "$env:SMOKE/profileA" -Log "$env:SMOKE/emeA.log" -Probe "$env:SMOKE/probe.html" -Label "A-fresh"
          "emeA=$eme" | Set-Content "$env:SMOKE/emeA.txt"
          "Phase A EME (shipped layout, flat Helium\WidevineCdm): $eme" | Add-Content "$env:SMOKE/summary.md"

          # If the shipped flat layout does not resolve the CDM, probe alternate
          # locations to separate a layout regression from "CI cannot do Widevine".
          if ($eme -notmatch 'eme=CDM_OK') {
            $chromeVer = (Get-Item "$app/chrome.exe").VersionInfo.ProductVersion
            "" | Add-Content "$env:SMOKE/summary.md"
            "## CDM path matrix (flat shipped path failed)" | Add-Content "$env:SMOKE/summary.md"
            # P1: legacy versioned dir (pre-fix layout).
            New-Item -ItemType Directory -Force "$app/$ver" | Out-Null
            Move-Item "$app/WidevineCdm" "$app/$ver/WidevineCdm" -Force
            $eme1 = & "$env:SMOKE/run-probe.ps1" -App $app -Profile "$env:SMOKE/profileP1" -Log "$env:SMOKE/emeP1.log" -Probe "$env:SMOKE/probe.html" -Label "P1-versioned"
            "emeP1=$eme1" | Set-Content "$env:SMOKE/emeP1.txt"
            "P1 (versioned Helium/$ver): $eme1" | Add-Content "$env:SMOKE/summary.md"
            Move-Item "$app/$ver/WidevineCdm" "$app/WidevineCdm" -Force
            Remove-Item "$app/$ver" -Recurse -Force
            # P2: chrome's own internal version directory (Application\<chromeVer>\WidevineCdm).
            New-Item -ItemType Directory -Force "$app/$chromeVer" | Out-Null
            Move-Item "$app/WidevineCdm" "$app/$chromeVer/WidevineCdm" -Force
            $eme2 = & "$env:SMOKE/run-probe.ps1" -App $app -Profile "$env:SMOKE/profileP2" -Log "$env:SMOKE/emeP2.log" -Probe "$env:SMOKE/probe.html" -Label "P2-chromever"
            "emeP2=$eme2" | Set-Content "$env:SMOKE/emeP2.txt"
            "P2 (chrome internal dir $chromeVer): $eme2" | Add-Content "$env:SMOKE/summary.md"
            Move-Item "$app/$chromeVer/WidevineCdm" "$app/WidevineCdm" -Force
            Remove-Item "$app/$chromeVer" -Recurse -Force
          }

          if ($fail.Count -gt 0) {
            throw "Phase A failed: $($fail -join '; ')"
          }

      - name: Phase F — manual-launch matrix (raw shortcut invocation)
        id: phaseF
        # Measurement phase: it must never stop the other phases from running,
        # because its own verdict is what tells us whether the mitigation works.
        continue-on-error: true
        run: |
          $fail = [System.Collections.Generic.List[string]]::new()
          function Assert([bool]$cond, [string]$msg) {
            if ($cond) { "PASS: $msg" | Add-Content "$env:SMOKE/summary.md" }
            else { "FAIL: $msg" | Add-Content "$env:SMOKE/summary.md"; $script:fail.Add($msg) }
          }
          "" | Add-Content "$env:SMOKE/summary.md"
          "## Phase F — manual launch matrix (raw chrome.exe, like a user shortcut)" | Add-Content "$env:SMOKE/summary.md"

          # Reproduces issue #9 exactly as reported: chrome.exe invoked directly
          # (no Chrome++ loader), so the *default* user data directory rules and
          # the browser may create %LOCALAPPDATA%\imput\Helium. The reporter still
          # sees it, so this matrix answers empirically what stops it:
          #   f1 shipped-style flags, raw exe, no --user-data-dir
          #   f2 shipped + --disable-crash-reporter
          #   f3 shipped + BREAKPAD_DUMP_LOCATION env var
          #   f4 control: no --breakpad-dump-location at all
          $app = "$env:SMOKE/fresh/Helium_Portable/Helium"
          $root = "$env:SMOKE/fresh/Helium_Portable"
          $imputRoot = Join-Path $env:LOCALAPPDATA 'imput'

          $cwdNow = (Get-Location).Path
          "diag: job cwd=[$cwdNow]; a raw launcher in Helium\\ with working directory Helium\\ resolves ..\\Data\\Crashpad to [$app\\..\\Data\\Crashpad]" | Add-Content "$env:SMOKE/summary.md"

          # f5/f6 decide what the shipped default should be:
          #   f5 passes the relative resolved to an absolute path (what a launcher
          #      can compute itself, working directory independent)
          #   f6 passes "%LOCALAPPDATA%" literally, to see whether Chromium expands
          #      environment variables inside a switch value (which would let the
          #      ini itself be location independent)
          function Run-Raw([string]$label, [string[]]$extra, [string]$envValue, [string]$dumpLoc) {
            $dumpLoc = if ($dumpLoc) { $dumpLoc } else { '..\Data\Crashpad' }
            Remove-Item $imputRoot -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item "$root/Data" -Recurse -Force -ErrorAction SilentlyContinue
            if ($envValue) { $env:BREAKPAD_DUMP_LOCATION = $envValue } else { Remove-Item Env:BREAKPAD_DUMP_LOCATION -ErrorAction SilentlyContinue }
            $errF = "$env:SMOKE/raw-$label-err.txt"
            $launchArgs = @('--no-first-run','--no-default-browser-check',
                            '--headless=new','--disable-gpu',
                            "--breakpad-dump-location=$dumpLoc",'about:blank') + $extra
            $workDir = $app
            $windows = -not ($launchArgs -contains '--headless=new')
            try {
              if ($windows) {
                $p = Start-Process -FilePath "$app\chrome.exe" -ArgumentList $launchArgs `
                     -WorkingDirectory $workDir -PassThru
                Start-Sleep -Seconds 12
              } else {
                $p = Start-Process -FilePath "$app\chrome.exe" -ArgumentList $launchArgs `
                     -WorkingDirectory $workDir -PassThru -WindowStyle Hidden `
                     -RedirectStandardError $errF -RedirectStandardOutput "$env:SMOKE/raw-$label-out.txt"
                if (-not $p.WaitForExit(45000)) { try { $p.Kill($true) } catch {} ; $p.WaitForExit(5000) }
              }
            } catch {
              "  [$label] launch failed: $($_.Exception.Message)" | Add-Content "$env:SMOKE/summary.md"
            }
            Stop-Process -Name chrome -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
            $base = Test-Path (Join-Path $imputRoot 'Helium')
            $crash = Test-Path (Join-Path $imputRoot 'Helium\User Data\Crashpad')
            $portable = Test-Path "$root/Data/Crashpad"
            $diag = ''
            if (Test-Path $errF) {
              $diag = ((Get-Content $errF -ErrorAction SilentlyContinue |
                        Where-Object { $_ -match 'breakpad|crashpad|crash-dumps|DIR_CRASH' } |
                        Select-Object -First 3) -join ' || ')
            }
            "[$label] imput\Helium=$base; imput Crashpad=$crash; portableCrashpad=$portable; stderr=[$diag]" | Add-Content "$env:SMOKE/summary.md"
            return @{ base = $base; crash = $crash; portable = $portable }
          }

          $f1 = Run-Raw 'f1-raw-shipped' @() ''
          $absDump = Join-Path $root 'Data\Crashpad'
          $f5 = Run-Raw 'f5-absolute-path' @() '' $absDump
          $f6 = Run-Raw 'f6-percent-localappdata' @() '' '%LOCALAPPDATA%\HeliumPortableCrashpad'
          # f7/f8: a real window that stays alive. Crashpad only tends to start a
          # handler in a live browsing session, which is closer to the reporter's
          # situation (they saw the folder appear while using the browser).
          $f7 = Run-Raw 'f7-headed-window' @('chrome://version') ''
          # f9 reproduces the SHIPPED launcher flags exactly (absolute dump path,
          # explicit user-data-dir, crash reporter off).
          $f9 = Run-Raw 'f9-shipped-launcher-flags' @("--user-data-dir=$root\Data",'--disable-crash-reporter') '' (Join-Path $root 'Data\Crashpad')
          $f8 = Run-Raw 'f8-headed-no-crash-reporter' @('--disable-crash-reporter','chrome://version') ''
          $f2 = Run-Raw 'f2-no-crash-reporter' @('--disable-crash-reporter') ''
          $f3 = Run-Raw 'f3-env-var' @() (Join-Path $root 'Data\Crashpad')
          $f4 = Run-Raw 'f4-control-no-flag' @('--disable-crash-reporter') ''

          "issue9-base=$(($f1.base -or $f2.base -or $f3.base -or $f4.base))" | Set-Content "$env:SMOKE/issue9b.txt"
          $f6dir = Join-Path (Join-Path $env:LOCALAPPDATA 'HeliumPortableCrashpad') ''
          "[f6 follow-up] %LOCALAPPDATA% literal result: imput\Helium=$($f6.base); portableCrashpad=$($f6.portable); percent-dir-exists=$(Test-Path $f6dir)" | Add-Content "$env:SMOKE/summary.md"
          Assert (-not ($f2.base -or $f3.base)) "no variant with the mitigation recreated %LOCALAPPDATA%\imput\Helium"
          if ($f1.base -and -not $f2.base -and -not $f3.base) {
            "DIAGNOSIS: the AppData leak is reproducible with the shipped flags alone and is fixed by --disable-crash-reporter and by BREAKPAD_DUMP_LOCATION." | Add-Content "$env:SMOKE/summary.md"
          } elseif ($f1.base -and $f2.base) {
            "DIAGNOSIS: neither mitigation prevents it — the base folder is created regardless of Crashpad." | Add-Content "$env:SMOKE/summary.md"
          } elseif (-not $f1.base) {
            "DIAGNOSIS: not reproducible in CI with a raw launcher; the reporter's environment differs (see their shortcut working directory)." | Add-Content "$env:SMOKE/summary.md"
          }
          if ($fail.Count -gt 0) { throw "Phase F failed: $($fail -join '; ')" }

      - name: Phase B — simulate old install + run real update.bat
        id: phaseB
        run: |
          $fail = [System.Collections.Generic.List[string]]::new()
          function Assert([bool]$cond, [string]$msg) {
            if ($cond) { "PASS: $msg" | Add-Content "$env:SMOKE/summary.md" }
            else { "FAIL: $msg" | Add-Content "$env:SMOKE/summary.md"; $script:fail.Add($msg) }
          }
          $app = "$env:SMOKE/fresh/Helium_Portable/Helium"
          $ver = '${{ steps.rel.outputs.ver }}'

          # Simulate a PRE-FIX install: version marker old + CDM nested under a
          # versioned dir + no flat CDM — exactly what unified releases shipped
          # before the flat-layout fix. update.bat must migrate it to flat.
          Set-Content "$app/version.txt" "0.0.0.0"
          New-Item -ItemType Directory -Force "$app/0.0.0.0" | Out-Null
          Move-Item "$app/WidevineCdm" "$app/0.0.0.0/WidevineCdm" -Force
          Assert (-not (Test-Path "$app/WidevineCdm")) "pre-update: flat CDM absent (old-install simulation)"
          $protected = 'chrome++.ini','update.bat','debloater.reg','default-apps-multi-profile.bat','bypass_windows_defender.bat'
          foreach ($f in $protected) { (Get-FileHash "$app/$f").Hash + ' ' + $f | Add-Content "$env:SMOKE/hashes-before.txt" }

          "" | Add-Content "$env:SMOKE/summary.md"
          "## Update flow (version.txt forced to 0.0.0.0)" | Add-Content "$env:SMOKE/summary.md"

          # Upstream latest, for post-update expectations.
          # Retry first: a rate-limited lookup would make update.bat a no-op, and
          # "the CDM broke after update" would then be a FALSE diagnosis.
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $expected = $null
          foreach ($attempt in 1..4) {
            try {
              $up = Invoke-RestMethod -Headers $h "https://api.github.com/repos/imputnet/helium-windows/releases?per_page=10"
              $expected = ($up | Where-Object { -not $_.prerelease } | Select-Object -First 1).tag_name
              if ($expected) { break }
            } catch {
              "attempt $attempt to read upstream releases failed: $($_.Exception.Message)" | Add-Content "$env:SMOKE/summary.md"
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $expected) {
            "SKIP: upstream release list unavailable (API rate limit/unreachable) — the update flow was NOT exercised, so no DRM conclusion may be drawn from this phase." | Add-Content "$env:SMOKE/summary.md"
            "rated=true" | Set-Content "$env:SMOKE/phaseB-skew.txt"
            "" | Add-Content "$env:SMOKE/summary.md"
            "## Update flow skipped (upstream lookup unavailable)" | Add-Content "$env:SMOKE/summary.md"
            return
          }
          "Upstream latest: $expected" | Add-Content "$env:SMOKE/summary.md"
          $expected | Set-Content "$env:SMOKE/expected.txt"

          # Run the real update.bat; stdin feeds both Read-Host prompts.
          $bat = "$app/update.bat"
          if (-not (Test-Path $bat)) { throw "update.bat missing from zip" }
          "Running update.bat (piped 'y')..." | Add-Content "$env:SMOKE/summary.md"
          $batDir = $app
          Push-Location $batDir
          try {
            $p = Start-Process -FilePath "$env:ComSpec" -ArgumentList '/c','echo y| update.bat' -WorkingDirectory $batDir -Wait -PassThru -NoNewWindow
            "update.bat exit code: $($p.ExitCode)" | Add-Content "$env:SMOKE/summary.md"
          } finally { Pop-Location }

          # Post-update asserts.
          $newV = (Get-Content "$app/version.txt" -Raw).Trim()
          Assert ($newV -eq $expected) "update: version.txt bumped to upstream latest ($newV == $expected)"
          $protectedOk = $true
          foreach ($line in (Get-Content "$env:SMOKE/hashes-before.txt")) {
            $parts = $line -split ' ', 2
            if ((Get-FileHash "$app/$($parts[1])").Hash -ne $parts[0]) {
              $protectedOk = $false
              "FAIL: protected file changed: $($parts[1])" | Add-Content "$env:SMOKE/summary.md"
              $fail.Add("protected changed: $($parts[1])")
            }
          }
          Assert $protectedOk "update: protected files unchanged (ini/bats)"
          Assert (Test-Path "$app/chrome.exe") "update: chrome.exe still present"

          Assert (Test-Path "$app/WidevineCdm/manifest.json") "update: nested CDM migrated to flat Helium\WidevineCdm by update.bat"
          Assert (-not (Test-Path "$app/0.0.0.0/WidevineCdm")) "update: versioned CDM dir removed after migration"

          # EME probe after the update (flat CDM must be in place via migration).
          $eme = & "$env:SMOKE/run-probe.ps1" -App $app -Profile "$env:SMOKE/profileB" -Log "$env:SMOKE/emeB.log" -Probe "$env:SMOKE/probe.html" -Label "B-postupdate"
          "emeB=$eme" | Set-Content "$env:SMOKE/emeB.txt"
          "Phase B EME: $eme" | Add-Content "$env:SMOKE/summary.md"

          if ($fail.Count -gt 0) { throw "Phase B failed: $($fail -join '; ')" }

      - name: Phase C — Crashpad location matrix (issue #9)
        id: phaseC
        run: |
          $fail = [System.Collections.Generic.List[string]]::new()
          function Assert([bool]$cond, [string]$msg) {
            if ($cond) { "PASS: $msg" | Add-Content "$env:SMOKE/summary.md" }
            else { "FAIL: $msg" | Add-Content "$env:SMOKE/summary.md"; $script:fail.Add($msg) }
          }
          $root = "$env:SMOKE/fresh/Helium_Portable"
          $app = "$root/Helium"
          "" | Add-Content "$env:SMOKE/summary.md"
          "## Phase C — Crashpad location matrix (issue #9)" | Add-Content "$env:SMOKE/summary.md"

          $ini = Get-Content "$app/chrome++.ini" -Raw
          $cmdLine = (($ini -split "`n" | Where-Object { $_ -match '^command_line=' }) -join '')
          Assert ($cmdLine -match '--breakpad-dump-location=') "ini: command_line sets --breakpad-dump-location (issue #9 fix shipped)"
          Assert ($cmdLine -notmatch '--disable-component-update') "ini: command_line has no --disable-component-update (issue #10 fix shipped)"
          if (-not (Test-Path "$app/version.dll")) { Move-Item "$app/version.dll.hidden" "$app/version.dll" -Force }
          Assert (Test-Path "$app/version.dll") "version.dll restored for the portable-launch test"

          $imputRoot = Join-Path $env:LOCALAPPDATA 'imput'

          function Run-Variant([string]$label, [string[]]$extra) {
            Remove-Item $imputRoot -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item "$root/Data" -Recurse -Force -ErrorAction SilentlyContinue
            $errF = "$env:SMOKE/cp-$label-err.txt"
            $outF = "$env:SMOKE/cp-$label-out.txt"
            $launchArgs = @('--no-first-run','--no-default-browser-check',"--user-data-dir=$root/Data",
                            "--breakpad-dump-location=..\Data\Crashpad") + $extra
            try {
              $p = Start-Process -FilePath "$app/chrome.exe" -ArgumentList $launchArgs -WorkingDirectory $app -PassThru `
                   -WindowStyle Hidden -RedirectStandardError $errF -RedirectStandardOutput $outF
              $exited = $p.WaitForExit(45000)
              $handlerSeen = $false
              for ($i = 0; $i -lt 10 -and -not $handlerSeen; $i++) {
                if (Get-CimInstance Win32_Process -Filter "Name = 'chrome.exe'" -ErrorAction SilentlyContinue |
                    Where-Object { $_.CommandLine -like '*crashpad-handler*' }) { $handlerSeen = $true; break }
                Start-Sleep -Milliseconds 700
              }
              if (-not $exited) { try { $p.Kill($true) } catch {} ; $p.WaitForExit(5000) }
              Stop-Process -Name chrome -Force -ErrorAction SilentlyContinue
              Start-Sleep 2
            } catch {
              "  launch error: $($_.Exception.Message)" | Add-Content "$env:SMOKE/summary.md"
            }
            $leak = Test-Path $imputRoot
            $portable = Test-Path "$root/Data/Crashpad"
            $dataItems = @()
            if (Test-Path "$root/Data") { $dataItems = Get-ChildItem "$root/Data" -Force -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { $_.Name } }
            $cpLines = @()
            if (Test-Path $errF) { $cpLines = Get-Content $errF -ErrorAction SilentlyContinue | Where-Object { $_ -match 'crashpad|breakpad|crash' } | Select-Object -First 2 }
            "[$label] leakAppData=$leak; portableCrashpad=$portable; handlerProcess=$handlerSeen; Data=[$($dataItems -join ', ')]" | Add-Content "$env:SMOKE/summary.md"
            if ($leak) { (Get-ChildItem $imputRoot -Recurse -Force | Select-Object -First 10 | ForEach-Object { "  LEAK: $($_.FullName)" }) | Add-Content "$env:SMOKE/summary.md" }
            if ($cpLines) { $cpLines | ForEach-Object { "  stderr: $($_.Trim())" } | Add-Content "$env:SMOKE/summary.md" }
            return @{ leak = $leak; portable = $portable }
          }

          $r1 = Run-Variant 'baseline-headless' @('--headless=new','--disable-gpu','about:blank')
          $r2 = Run-Variant 'enable-crash-reporter' @('--headless=new','--disable-gpu','--enable-crash-reporter','--enable-crash-reporter-for-testing','about:blank')
          $r3 = Run-Variant 'headed-crashpad' @('--enable-crash-reporter','--enable-crash-reporter-for-testing','about:blank')
          $r4 = Run-Variant 'simulate-crash' @('--headless=new','--disable-gpu','--enable-crash-reporter','--enable-crash-reporter-for-testing','chrome://crash')

          # The leak is the actual bug; the portable Crashpad dir only proves the
          # redirect was honoured (Crashpad may legitimately not initialise in CI).
          Assert (-not ($r1.leak -or $r2.leak -or $r3.leak -or $r4.leak)) "no variant recreated %LOCALAPPDATA%\imput (issue #9: Crashpad stays portable)"
          $anyPortable = ($r1.portable -or $r2.portable -or $r3.portable -or $r4.portable)
          if (-not $anyPortable) {
            "WARN: Crashpad never initialised in any variant — %LOCALAPPDATA% absence is therefore not yet proof that the redirect works; kept as a WARN, not a failure." | Add-Content "$env:SMOKE/summary.md"
          }
          $leaked = ($r1.leak -or $r2.leak -or $r3.leak -or $r4.leak)
          "issue9-leak=$leaked`nissue9-portable=$anyPortable" | Set-Content "$env:SMOKE/issue9.txt"

          if ($fail.Count -gt 0) { throw "Phase C failed: $($fail -join '; ')" }

      - name: Phase D — Widevine robustness matrix (L1 vs L3, best effort)
        id: phaseD
        continue-on-error: true
        run: |
          $root = "$env:SMOKE/fresh/Helium_Portable"
          $app = "$root/Helium"
          "" | Add-Content "$env:SMOKE/summary.md"
          "## Phase D — Widevine robustness matrix (L1 vs L3)" | Add-Content "$env:SMOKE/summary.md"
          if (-not (Test-Path "$app/version.dll.hidden")) { Move-Item "$app/version.dll" "$app/version.dll.hidden" -Force }
          Move-Item "$app/WidevineCdm" "$app/WidevineCdm-flat" -Force -ErrorAction SilentlyContinue
          $uri = 'file:///' + ("$env:SMOKE/probe-rob.html" -replace '\\', '/')
          $out = "$env:SMOKE/dump-rob-out.txt"; $err = "$env:SMOKE/dump-rob-err.txt"
          # Virtual time keeps the DOM dump alive long enough for an async probe,
          # but it does not advance the CDM's own registration, which surfaced as
          # 5x TIMEOUT. The probe therefore retries NotSupportedError up to 24x
          # with 300 ms waits inside the virtual-time budget. --timeout is not an
          # option: chrome exits on its own and --dump-dom never prints.
          $argList = @('--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check',
                       '--disable-crash-reporter',"--user-data-dir=$env:SMOKE/profileD",
                       '--virtual-time-budget=120000','--dump-dom',$uri)
          try {
            $p = Start-Process -FilePath "$app/chrome.exe" -ArgumentList $argList -PassThru -NoNewWindow `
              -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $p.WaitForExit(180000)) { $p.Kill($true); $p.WaitForExit(5000) }
          } catch { "START_FAILED: $($_.Exception.Message)" | Add-Content "$env:SMOKE/summary.md" }
          Stop-Process -Name chrome -Force -ErrorAction SilentlyContinue
          $dom = if (Test-Path $out) { Get-Content $out -Raw } else { '' }
          Move-Item "$app/WidevineCdm-flat" "$app/WidevineCdm" -Force -ErrorAction SilentlyContinue
          # Best effort only: this matrix repeatedly came back without data in
          # headless CI (virtual time does not advance the CDM's registration,
          # real time truncates the dump), so an empty result is reported and
          # never treated as a DRM failure. Authoritative DRM evidence stays the
          # component_installer lines plus the EME probe in Phase A/B.
          $rob = 'NO_RESULT'
          if ($dom -match '(?s)<pre id="o">([^<]+)</pre>') {
            $pre = $Matches[1].Trim()
            if ($pre -ne 'pending' -and $pre -ne '') { $rob = $pre }
          }
          # Record both halves: which levels answered OK and which rejected, and
          # whether the CDM was registered as a preinstalled component at all.
          $cdmLine = ''
          foreach ($f in (Get-ChildItem $env:SMOKE -Filter 'dump-rob-err.txt' -ErrorAction SilentlyContinue)) {
            $hit = Get-Content $f.FullName -ErrorAction SilentlyContinue |
                   Where-Object { $_ -match 'Preinstalled component found|Registering Widevine|Component ready' } |
                   Select-Object -First 2
            if ($hit) { $cdmLine = ($hit -join ' || ') }
          }
          "$rob`ncdm=$cdmLine" | Set-Content "$env:SMOKE/eme-rob.txt"
          "Robustness matrix: $rob" | Add-Content "$env:SMOKE/summary.md"
          "Meaning — NONE=no security requirement; SW_*=software (L3) paths; HW_*=hardware (L1) paths. This CI measurement is unreliable (see the NO_RESULT comment below); the authoritative capability profile is the user-reported Axinom DRM Policy Tester run on real hardware: L3 cenc+cbcs OK, L1 cenc+cbcs rejected, PlayReady absent. L1 needs a device TEE + authorised CDM + an L1-issuing licence server, none of which a portable zip can provide." | Add-Content "$env:SMOKE/summary.md"
          if ($rob -eq 'NO_RESULT') {
            "NOTE: no matrix this run — chrome dumps the DOM before the async EME probe settles in headless CI. Not a DRM regression: Phase A/B prove the CDM registers and answers CDM_OK." | Add-Content "$env:SMOKE/summary.md"
          }
          (Get-Content $err -ErrorAction SilentlyContinue | Where-Object { $_ -match 'widevine|cdm' } | Select-Object -First 5) |
            Add-Content "$env:SMOKE/summary.md"

      - name: Phase E — arm64 archive layout (no CDM, launchers present)
        id: phaseE
        run: |
          $fail = [System.Collections.Generic.List[string]]::new()
          function Assert([bool]$cond, [string]$msg) {
            if ($cond) { "PASS: $msg" | Add-Content "$env:SMOKE/summary.md" }
            else { "FAIL: $msg" | Add-Content "$env:SMOKE/summary.md"; $script:fail.Add($msg) }
          }
          "" | Add-Content "$env:SMOKE/summary.md"
          "## Phase E — arm64 archive layout" | Add-Content "$env:SMOKE/summary.md"

          # No arm64 Widevine CDM exists for Windows, so the arm64 build ships
          # without one instead of carrying an unloadable x64 module. This phase
          # pins that, plus the root launchers, from the published zip.
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $r = Invoke-RestMethod -Headers $h "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          $arm = $r.assets | Where-Object { $_.name -match '^helium-portable-arm64_.*\.zip$' } | Select-Object -First 1
          if (-not $arm) {
            "SKIP: no arm64 asset on $($r.tag_name) — nothing to verify" | Add-Content "$env:SMOKE/summary.md"
            "phaseE=skipped" | Set-Content "$env:SMOKE/phaseE.txt"
            return
          }
          $zip = "$env:SMOKE/arm64.zip"
          Invoke-WebRequest -Uri $arm.browser_download_url -OutFile $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $za = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = $za.Entries | ForEach-Object { $_.FullName }
            Assert (($names | Where-Object { $_ -eq 'Helium_Portable/Helium/chrome.exe' }).Count -eq 1) "arm64: chrome.exe present"
            Assert (($names | Where-Object { $_ -match 'WidevineCdm' }).Count -eq 0) "arm64: no WidevineCdm shipped (no arm64 CDM exists; avoids a silent DRM gap)"
            foreach ($rf in 'Helium Browser.bat','Update Helium.bat','Set Default Browser.bat','Apply Debloat Policies.bat','Defender Exclusion.bat','README-FIRST.txt') {
              Assert (($names | Where-Object { $_ -eq "Helium_Portable/$rf" }).Count -eq 1) "arm64: root launcher present: $rf"
            }
            Assert (($names | Where-Object { $_ -like 'Helium_Portable/Helium/*.exe' }).Count -ge 1) "arm64: browser binaries present"
            $top = ($names | Where-Object { $_ -match '^Helium_Portable/[^/]+$' }) -join ', '
            "arm64 root entries: $top" | Add-Content "$env:SMOKE/summary.md"
          } finally { $za.Dispose() }
          "phaseE=$(if ($fail.Count -gt 0) { 'failed' } else { 'ok' })" | Set-Content "$env:SMOKE/phaseE.txt"
          if ($fail.Count -gt 0) { throw "Phase E failed: $($fail -join '; ')" }

      - name: "Verdict — issues #5/#9/#10 status"
        if: always()
        run: |
          $summary = "$env:SMOKE/summary.md"
          function Read-Result([string]$path) {
            if (-not (Test-Path $path)) { return @{ eme = 'MISSING'; comp = 'MISSING' } }
            $raw = (Get-Content $path -Raw).Trim()
            $eme = if ($raw -match 'eme=([^;]+)') { $Matches[1].Trim() } else { 'MISSING' }
            $comp = if ($raw -match 'component=(.+)$') { $Matches[1].Trim() } else { 'MISSING' }
            return @{ eme = $eme; comp = $comp }
          }
          function Test-Comp([string]$c) { return $c -match '^\d+\.\d+\.\d+\.\d+$' -and $c -ne '0.0.0.0' }
          # Phase C/D artifacts (issue #9 Crashpad + L1/L3 matrix). These files
          # are written with Set-Content, so read them as plain text.
          $imputLeak = 'MISSING'
          $cpInit = 'NOT_MEASURED'
          if (Test-Path "$env:SMOKE/issue9.txt") {
            $i9 = (Get-Content "$env:SMOKE/issue9.txt" -Raw).Trim()
            # 'issue9-portable=False' means every variant ran and none leaked,
            # but Crashpad never initialised either — treat as WARNonly then.
            $leaked = ($i9 -match 'issue9-leak=True')
            $imputLeak = if ($leaked) { 'LEAKED' } else { 'ABSENT' }
            $cpInit = if ($i9 -match 'issue9-portable=True') { 'INITIALISED' } else { 'NOT_INITIALISED' }
          }
          $rob = 'MISSING'
          $robCdm = 'MISSING'
          if (Test-Path "$env:SMOKE/eme-rob.txt") {
            $robRaw = (Get-Content "$env:SMOKE/eme-rob.txt" -Raw).Trim()
            $rob = ($robRaw -split "`n")[0].Trim()
            if ($robRaw -match '(?m)^cdm=(.+)$') { $robCdm = $Matches[1].Trim() }
          }
          $A0 = Read-Result "$env:SMOKE/emeA.txt"
          $P1 = Read-Result "$env:SMOKE/emeP1.txt"
          $P2 = Read-Result "$env:SMOKE/emeP2.txt"
          $B0 = Read-Result "$env:SMOKE/emeB.txt"
          $fails = @()
          $app = "$env:SMOKE/fresh/Helium_Portable/Helium"
          $ver = '${{ steps.rel.outputs.ver }}'
          $chromeVer = ''
          if (Test-Path "$app/chrome.exe") { $chromeVer = (Get-Item "$app/chrome.exe").VersionInfo.ProductVersion }

          "" | Add-Content $summary
          "## Probe results" | Add-Content $summary
          "- A0 shipped flat layout (Helium\WidevineCdm): EME=$($A0.eme); component=$($A0.comp)" | Add-Content $summary
          if ($P1.eme -ne 'MISSING') { "- P1 versioned Helium/$ver (pre-fix layout): EME=$($P1.eme); component=$($P1.comp)" | Add-Content $summary }
          if ($P2.eme -ne 'MISSING') { "- P2 chrome internal dir ($chromeVer): EME=$($P2.eme); component=$($P2.comp)" | Add-Content $summary }
          "- B0 after update.bat (legacy install migrated to flat): EME=$($B0.eme); component=$($B0.comp)" | Add-Content $summary

          "" | Add-Content $summary
          "## chrome stderr Widevine/CDM lines" | Add-Content $summary
          $anyLog = $false
          foreach ($f in (Get-ChildItem "$env:SMOKE" -Filter 'dump-*-err.txt' -ErrorAction SilentlyContinue)) {
            $hits = Get-Content $f.FullName -ErrorAction SilentlyContinue | Where-Object { $_ -match 'widevine|cdm|CDM' } | Select-Object -First 5
            foreach ($h in $hits) { $anyLog = $true; "- $($f.Name): $($h.Trim())" | Add-Content $summary }
          }
          if (-not $anyLog) { "- none found in any probe stderr" | Add-Content $summary }

          "" | Add-Content $summary
          "## Verdict" | Add-Content $summary
          $okA0 = $A0.eme -eq 'CDM_OK'
          $okB0 = $B0.eme -eq 'CDM_OK'

          $bSkipped = (Test-Path "$env:SMOKE/phaseB-skew.txt") -and ((Get-Content "$env:SMOKE/phaseB-skew.txt" -Raw).Trim() -eq 'rated=true')
          if ($bSkipped) {
            "**PHASE B SKIPPED (upstream lookup unavailable)** — update.bat never ran a real update (GitHub API rate limit on the shared runner IP), so no DRM conclusion is drawn. Phase A evidence stands; re-run when the API is reachable." | Add-Content $summary
          } elseif ($B0.eme -eq 'MISSING') {
            $fails += "Phase B did not run or produced no result (earlier step failed)"
            "**PHASE B MISSING** — the update-flow verification did not complete; see the failed step above." | Add-Content $summary
          } elseif ($okA0 -and $okB0) {
            "**#5 RESOLVED — evidence to close** — CDM resolves on the fresh flat-layout zip ($($A0.eme)) AND after a real update.bat run that migrated a legacy nested install ($($B0.eme)). Layout + update flow verified end-to-end on chrome.exe $chromeVer." | Add-Content $summary
          } elseif ($okA0 -and -not $okB0) {
            $fails += "#5 CONFIRMED: fresh flat=CDM_OK but post-update=$($B0.eme)"
            "**#5 CONFIRMED** — fresh flat layout resolves the CDM but after update.bat it does not ($($B0.eme)); migration/preservation broken." | Add-Content $summary
          } elseif ((-not $okA0) -and (($P1.eme -eq 'CDM_OK') -or ($P2.eme -eq 'CDM_OK'))) {
            $where = if ($P1.eme -eq 'CDM_OK') { "legacy versioned Helium/$ver" } else { "chrome internal dir $chromeVer" }
            $alt = if ($P1.eme -eq 'CDM_OK') { $P1.eme } else { $P2.eme }
            $fails += "layout regression: flat fails but $where works"
            "**LAYOUT REGRESSION** — flat shipped path fails ($($A0.eme)) but $where resolves ($alt). Re-check main.yml CDM copy / update.bat migration." | Add-Content $summary
          } else {
            $fails += "EME unavailable in CI: A0=$($A0.eme), P1=$($P1.eme), P2=$($P2.eme)"
            "**EME UNAVAILABLE IN CI** — no CDM location resolves under headless Windows CI (flat A0=$($A0.eme), versioned P1=$($P1.eme), chrome-ver P2=$($P2.eme)); chrome cannot be validated remotely in this environment. Filesystem asserts above (flat layout, migration, version bump, protected files) still stand as #5 evidence. See stderr lines above for chrome's own CDM messages." | Add-Content $summary
          }

          "" | Add-Content $summary
          "## Issue #9 (Crashpad stays portable) + L1/L3 matrix" | Add-Content $summary
          "- Crashpad leak check over 4 launch variants (%LOCALAPPDATA%\imput): $imputLeak (Crashpad initialised: $cpInit)" | Add-Content $summary
          "- Widevine robustness matrix (best-effort, headless-unreliable): $rob" | Add-Content $summary
          "- Phase D CDM registration log: $robCdm" | Add-Content $summary
          $armNote = 'MISSING'
          if (Test-Path "$env:SMOKE/phaseE.txt") {
            $armNote = (Get-Content "$env:SMOKE/phaseE.txt" -Raw).Trim()
            if ($armNote -match 'skipped') { $armNote = 'SKIPPED (no arm64 asset in the latest release)' }
            elseif ($armNote -match 'ok') { $armNote = 'arm64 archive carries no CDM and ships the root launchers' }
          }
          "- arm64 archive check: $armNote" | Add-Content $summary
          if ($imputLeak -eq 'LEAKED') {
            $fails += "issue #9 regression: Crashpad recreated %LOCALAPPDATA%\imput"
            "**#9 REGRESSION** — the shipped --breakpad-dump-location did not keep Crashpad inside the portable folder; see Phase C." | Add-Content $summary
          } elseif ($imputLeak -eq 'ABSENT' -and $cpInit -eq 'INITIALISED') {
            "**#9 VERIFIED** — Crashpad initialised and stayed inside the portable folder; no %LOCALAPPDATA%\imput is created by a portable launch." | Add-Content $summary
          } elseif ($imputLeak -eq 'ABSENT') {
            "**#9 NOT REPRODUCED / NOT PROVEN** — no %LOCALAPPDATA%\imput was created, but Crashpad did not initialise in any CI variant, so the redirect itself is unproven here; treat the AppData report as environment-specific and keep the flag + verify manually on Windows." | Add-Content $summary
          } else {
            "**#9 NOT MEASURED** — Phase C did not run to completion." | Add-Content $summary
          }

          "" | Add-Content $summary
          if ($fails.Count -gt 0) { "**Result: FAILED**" | Add-Content $summary }
          else { "**Result: PASSED**" | Add-Content $summary }

          Get-Content $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Write-Host
          "=========== windows-smoke summary ==========" | Write-Host
          Get-Content $summary | Write-Host
          "============================================" | Write-Host
          if ($fails.Count -gt 0) { $fails | ForEach-Object { "FAIL: $_" | Write-Host }; exit 1 }
