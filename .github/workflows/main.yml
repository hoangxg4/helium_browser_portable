name: Build Helium Portable

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: helium-portable-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      helium_ver: ${{ steps.check.outputs.helium_ver }}
      plus_ver: ${{ steps.check.outputs.plus_ver }}
      plus_url: ${{ steps.check.outputs.plus_url }}
      helium_url_x64: ${{ steps.check.outputs.helium_url_x64 }}
      helium_url_arm64: ${{ steps.check.outputs.helium_url_arm64 }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
    - name: Check versions and releases
      id: check
      run: |
        set -e

        # Fetch latest Helium release
        HELIUM=$(curl -sSL "https://api.github.com/repos/imputnet/helium-windows/releases/latest")
        HELIUM_VER=$(echo "$HELIUM" | jq -r '.tag_name')

        # Fetch latest Chrome++ release
        PLUS=$(curl -sSL "https://api.github.com/repos/bibicadotnet/Chromium_SetDLL/releases/latest")
        PLUS_VER=$(echo "$PLUS" | jq -r '.tag_name' | sed 's/^v//')
        PLUS_URL=$(echo "$PLUS" | jq -r '.assets[] | select(.name | test("Chrome.*\\.7z$")) | .browser_download_url')

        echo "Helium: $HELIUM_VER"
        echo "Chrome++: $PLUS_VER"

        # Get per-arch download URLs
        HELIUM_URL_X64=$(echo "$HELIUM" | jq -r '.assets[] | select(.name | test("x64-windows\\.zip$")) | .browser_download_url')
        HELIUM_URL_ARM64=$(echo "$HELIUM" | jq -r '.assets[] | select(.name | test("arm64-windows\\.zip$")) | .browser_download_url')

        echo "x64 URL: $HELIUM_URL_X64"
        echo "arm64 URL: $HELIUM_URL_ARM64"

        # Check existing unified release: tag exists AND both zip assets present.
        # A tag with a missing arch zip counts as NOT released (self-repair:
        # rebuild + softprops overwrite adds the missing zip to the same tag).
        TAG="helium-portable_${HELIUM_VER}_${PLUS_VER}"

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          EXISTS="false"
          echo "Manual dispatch — forcing rebuild"
        else
          REL=$(curl -sSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" || true)
          ASSET_COUNT=$(echo "$REL" | jq '[.assets[]? | select(.name | test("helium-portable-(x64|arm64)_.*\\.zip$"))] | length' 2>/dev/null || echo 0)
          case "$ASSET_COUNT" in
            ''|*[!0-9]*) ASSET_COUNT=0 ;;
          esac
          if echo "$REL" | jq -e '.tag_name' >/dev/null 2>&1 && [ "$ASSET_COUNT" -ge 2 ]; then
            EXISTS="true"
          else
            EXISTS="false"
          fi
        fi

        echo "Unified tag: $TAG"
        echo "exists: $EXISTS"

        # Outputs
        echo "helium_ver=$HELIUM_VER" >> $GITHUB_OUTPUT
        echo "plus_ver=$PLUS_VER" >> $GITHUB_OUTPUT
        echo "plus_url=$PLUS_URL" >> $GITHUB_OUTPUT
        echo "helium_url_x64=$HELIUM_URL_X64" >> $GITHUB_OUTPUT
        echo "helium_url_arm64=$HELIUM_URL_ARM64" >> $GITHUB_OUTPUT
        echo "exists=$EXISTS" >> $GITHUB_OUTPUT

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
    - uses: actions/checkout@v4

    - name: Build (${{ matrix.arch }})
      run: |
        $arch = "${{ matrix.arch }}"
        $heliumVer = "${{ needs.check.outputs.helium_ver }}"
        $plusVer = "${{ needs.check.outputs.plus_ver }}"
        $tag = "helium-portable-${arch}_${heliumVer}_${plusVer}"

        # Download Helium
        if ($arch -eq "x64") {
          $heliumUrl = "${{ needs.check.outputs.helium_url_x64 }}"
        } else {
          $heliumUrl = "${{ needs.check.outputs.helium_url_arm64 }}"
        }

        Write-Host "Architecture: $arch"
        Write-Host "Helium: $heliumVer"
        Write-Host "Chrome++: $plusVer"
        Write-Host "Tag: $tag"

        curl -sSL "$heliumUrl" -o helium.zip
        curl -sSL "${{ needs.check.outputs.plus_url }}" -o chrome_plus.7z

        # 7-Zip: prefer the runner's preinstalled copy, then a 7zr.exe that is
        # already in the workspace, and only then fetch 7zr.exe from the
        # internet. A DNS blip on www.7-zip.org used to abort the whole build.
        $sevenZip = $null
        foreach ($cand in @("$env:ProgramFiles\7-Zip\7z.exe", "${env:ProgramFiles(x86)}\7-Zip\7z.exe", "$PWD\7zr.exe")) {
          if (Test-Path $cand) { $sevenZip = $cand; break }
        }
        if (-not $sevenZip) {
          try {
            curl.exe -fsSL https://www.7-zip.org/a/7zr.exe -o 7zr.exe
            if (Test-Path "$PWD\7zr.exe") { $sevenZip = "$PWD\7zr.exe" }
          } catch { }
        }
        if (-not $sevenZip) { Write-Error "no 7-Zip extractor available (preinstalled or downloadable) — aborting"; exit 1 }
        Write-Host "7-Zip: $sevenZip"

        Expand-Archive -Path helium.zip -DestinationPath helium_extracted -Force
        & $sevenZip x chrome_plus.7z -y
        if ($LASTEXITCODE -ne 0) { Write-Error "7-Zip failed to extract chrome_plus.7z (exit $LASTEXITCODE) — aborting"; exit 1 }

        # hibbiki-style layout: everything fixed lives under Helium_Portable\Helium\
        New-Item -Force -Type Directory Helium_Portable\Helium | Out-Null

        # Copy Helium files
        $heliumDir = Get-ChildItem helium_extracted -Directory | Select-Object -First 1
        Copy-Item "$($heliumDir.FullName)\*" Helium_Portable\Helium\ -Recurse -Force

        # Copy Chrome++ version.dll for the right architecture.
        # Use -like (literal wildcard), NOT a backslash-counting regex: the
        # previous regex demanded doubled backslashes that never occur in
        # Windows paths, so version.dll was silently dropped from releases
        # and portable data broke (issue #7).
        $dll = Get-ChildItem -Recurse -Filter version.dll |
          Where-Object { $_.FullName -like "*\${arch}\App\*" } |
          Select-Object -First 1
        if (-not $dll) {
          Write-Error "version.dll for $arch not found in Chrome++ archive — aborting build (portable data would be broken)"
          exit 1
        }
        Copy-Item $dll.FullName Helium_Portable\Helium\ -Force
        Write-Host "Chrome++ DLL: $($dll.FullName)"

        # Copy config files
        Copy-Item chrome++.ini,debloater.reg,default-apps-multi-profile.bat,update.bat,bypass_windows_defender.bat Helium_Portable\Helium\ -Force

        # Convenience launchers + quick-start note at the PACKAGE ROOT, so the
        # user does not have to go into Helium\ to start or update the browser.
        Copy-Item 'Helium Browser.bat','Update Helium.bat','Set Default Browser.bat','Apply Debloat Policies.bat','Defender Exclusion.bat','README-FIRST.txt' Helium_Portable\ -Force

        # Copy WidevineCdm — FLAT at Helium\WidevineCdm (next to chrome.exe) on
        # x64 and ONLY on x64. Chrome 154/Helium registers the preinstalled CDM
        # only from the exe-dir flat path (windows-smoke run 36306584637:
        # flat=CDM_OK, versioned=CDM_FAIL, chrome-ver=CDM_FAIL). There is no
        # arm64 Widevine CDM for Windows (Google ships none for that target), so
        # shipping the x64 DLL inside the arm64 zip created a package that looked
        # DRM-enabled but could never load a matching module.
        if ($arch -eq "x64") {
          Copy-Item WidevineCdm "Helium_Portable\Helium\" -Recurse -Force
        } else {
          Write-Host "arm64: WidevineCdm intentionally not shipped (no arm64 CDM exists for Windows)"
        }

        # Write version file
        Set-Content -Path "Helium_Portable\Helium\version.txt" -Value "$heliumVer"

        # Portable-behaviour guards on the config we are about to ship.
        # issue #10: --disable-component-update also stops preinstalled-component
        # registration, i.e. Chrome never finds the shipped WidevineCdm → DRM
        # breaks. issue #9: Crashpad is stored in <default user data dir>\Crashpad
        # on Windows and ignores --user-data-dir, so the config must redirect it
        # into the portable folder or every launch recreates
        # %LOCALAPPDATA%\imput\Helium\User Data\Crashpad.
        $iniLines = Get-Content "Helium_Portable\Helium\chrome++.ini" | Where-Object { $_ -match '^command_line=' }
        if ($iniLines -match '--disable-component-update') {
          Write-Error "shipped chrome++.ini contains --disable-component-update (breaks Widevine, issue #10) — aborting"
          exit 1
        }
        if (-not ($iniLines -match '--breakpad-dump-location=')) {
          Write-Error "shipped chrome++.ini does not redirect Crashpad (AppData leak, issue #9) — aborting"
          exit 1
        }

        # Safety net: never ship a zip without version.dll — portable data
        # (chrome++.ini data_dir) only works when Chrome++ DLL is loaded.
        if (-not (Test-Path "Helium_Portable\Helium\version.dll")) {
          Write-Error "Helium_Portable\Helium\version.dll missing before packaging — aborting"
          exit 1
        }
        if (-not (Test-Path "Helium_Portable\Helium\chrome.exe")) {
          Write-Error "Helium_Portable\Helium\chrome.exe missing before packaging — aborting"
          exit 1
        }
        if ($arch -eq "x64") {
          if (-not (Test-Path "Helium_Portable\Helium\WidevineCdm\manifest.json")) {
            Write-Error "WidevineCdm missing at flat Helium\WidevineCdm — aborting (Chrome would not register a versioned path)"
            exit 1
          }
        } else {
          if (Test-Path "Helium_Portable\Helium\WidevineCdm") {
            Write-Error "arm64 package must not contain the x64 Widevine CDM — aborting"
            exit 1
          }
        }

        # Root launchers must be present, otherwise "start the browser" breaks
        # for everyone while the build still succeeds.
        foreach ($f in 'Helium Browser.bat','Update Helium.bat','Set Default Browser.bat','Apply Debloat Policies.bat','Defender Exclusion.bat','README-FIRST.txt') {
          if (-not (Test-Path "Helium_Portable\$f")) {
            Write-Error "root launcher missing before packaging: $f — aborting"
            exit 1
          }
        }

        # Package
        Compress-Archive Helium_Portable "$tag.zip" -Force

        echo "ZIP=$tag.zip" >> $env:GITHUB_ENV

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: zip-${{ matrix.arch }}
        path: ${{ env.ZIP }}
        if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: zip-*
        merge-multiple: true

    - uses: softprops/action-gh-release@v2
      with:
        files: helium-portable-*.zip
        tag_name: helium-portable_${{ needs.check.outputs.helium_ver }}_${{ needs.check.outputs.plus_ver }}
        name: Helium ${{ needs.check.outputs.helium_ver }} + Chrome++ ${{ needs.check.outputs.plus_ver }}
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
