name: Build Helium Portable

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      helium_ver: ${{ steps.check.outputs.helium_ver }}
      plus_ver: ${{ steps.check.outputs.plus_ver }}
      plus_url: ${{ steps.check.outputs.plus_url }}
      exists_x64: ${{ steps.check.outputs.exists_x64 }}
      exists_arm64: ${{ steps.check.outputs.exists_arm64 }}
      helium_url_x64: ${{ steps.check.outputs.helium_url_x64 }}
      helium_url_arm64: ${{ steps.check.outputs.helium_url_arm64 }}
    steps:
    - name: Check versions and releases
      id: check
      run: |
        set -e

        # Fetch latest Helium release
        HELIUM=$(curl -sSL "https://api.github.com/repos/imputnet/helium-windows/releases/latest")
        HELIUM_VER=$(echo "$HELIUM" | jq -r '.tag_name')

        # Fetch latest Chrome++ release
        PLUS=$(curl -sSL "https://api.github.com/repos/bibicadotnet/Chromium_SetDLL/releases/latest")
        PLUS_VER=$(echo "$PLUS" | jq -r '.tag_name' | sed 's/^v//')
        PLUS_URL=$(echo "$PLUS" | jq -r '.assets[] | select(.name | test("Chrome.*\\.7z$")) | .browser_download_url')

        echo "Helium: $HELIUM_VER"
        echo "Chrome++: $PLUS_VER"

        # Get per-arch download URLs
        HELIUM_URL_X64=$(echo "$HELIUM" | jq -r '.assets[] | select(.name | test("x64-windows\\.zip$")) | .browser_download_url')
        HELIUM_URL_ARM64=$(echo "$HELIUM" | jq -r '.assets[] | select(.name | test("arm64-windows\\.zip$")) | .browser_download_url')

        echo "x64 URL: $HELIUM_URL_X64"
        echo "arm64 URL: $HELIUM_URL_ARM64"

        # Check existing releases
        TAG_X64="helium-portable-x64_${HELIUM_VER}_${PLUS_VER}"
        TAG_ARM64="helium-portable-arm64_${HELIUM_VER}_${PLUS_VER}"

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          EXISTS_X64="false"
          EXISTS_ARM64="false"
          echo "Manual dispatch — building all"
        else
          EXISTS_X64=$(curl -sSL -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_X64" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | grep -q 200 && echo "true" || echo "false")
          EXISTS_ARM64=$(curl -sSL -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_ARM64" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | grep -q 200 && echo "true" || echo "false")
        fi

        echo "x64 exists: $EXISTS_X64"
        echo "arm64 exists: $EXISTS_ARM64"

        # Outputs
        echo "helium_ver=$HELIUM_VER" >> $GITHUB_OUTPUT
        echo "plus_ver=$PLUS_VER" >> $GITHUB_OUTPUT
        echo "plus_url=$PLUS_URL" >> $GITHUB_OUTPUT
        echo "helium_url_x64=$HELIUM_URL_X64" >> $GITHUB_OUTPUT
        echo "helium_url_arm64=$HELIUM_URL_ARM64" >> $GITHUB_OUTPUT
        echo "exists_x64=$EXISTS_X64" >> $GITHUB_OUTPUT
        echo "exists_arm64=$EXISTS_ARM64" >> $GITHUB_OUTPUT

  build:
    needs: check
    if: |
      (needs.check.outputs.exists_x64 == 'false') ||
      (needs.check.outputs.exists_arm64 == 'false')
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
    - name: Skip if already released
      id: skip
      run: |
        if ("${{ matrix.arch }}" -eq "x64" -and "${{ needs.check.outputs.exists_x64 }}" -eq "true") {
          echo "x64 release already exists — skipping"
          echo "should_skip=true" >> $env:GITHUB_OUTPUT
        } elseif ("${{ matrix.arch }}" -eq "arm64" -and "${{ needs.check.outputs.exists_arm64 }}" -eq "true") {
          echo "arm64 release already exists — skipping"
          echo "should_skip=true" >> $env:GITHUB_OUTPUT
        } else {
          echo "should_skip=false" >> $env:GITHUB_OUTPUT
        }

    - uses: actions/checkout@v4
      if: steps.skip.outputs.should_skip != 'true'

    - name: Build (${{ matrix.arch }})
      if: steps.skip.outputs.should_skip != 'true'
      run: |
        $arch = "${{ matrix.arch }}"
        $heliumVer = "${{ needs.check.outputs.helium_ver }}"
        $plusVer = "${{ needs.check.outputs.plus_ver }}"
        $tag = "helium-portable-${arch}_${heliumVer}_${plusVer}"

        # Download Helium
        if ($arch -eq "x64") {
          $heliumUrl = "${{ needs.check.outputs.helium_url_x64 }}"
        } else {
          $heliumUrl = "${{ needs.check.outputs.helium_url_arm64 }}"
        }

        Write-Host "Architecture: $arch"
        Write-Host "Helium: $heliumVer"
        Write-Host "Chrome++: $plusVer"
        Write-Host "Tag: $tag"

        curl -sSL "$heliumUrl" -o helium.zip
        curl -sSL "${{ needs.check.outputs.plus_url }}" -o chrome_plus.7z
        curl -sSL https://www.7-zip.org/a/7zr.exe -o 7zr.exe

        Expand-Archive -Path helium.zip -DestinationPath helium_extracted -Force
        ./7zr.exe x chrome_plus.7z -y

        New-Item -Force -Type Directory Helium_Portable | Out-Null

        # Copy Helium files
        $heliumDir = Get-ChildItem helium_extracted -Directory | Select-Object -First 1
        Copy-Item "$($heliumDir.FullName)\*" Helium_Portable\ -Recurse -Force

        # Copy Chrome++ version.dll for the right architecture.
        # Use -like (literal wildcard), NOT a backslash-counting regex: the
        # previous regex demanded doubled backslashes that never occur in
        # Windows paths, so version.dll was silently dropped from releases
        # and portable data broke (issue #7).
        $dll = Get-ChildItem -Recurse -Filter version.dll |
          Where-Object { $_.FullName -like "*\${arch}\App\*" } |
          Select-Object -First 1
        if (-not $dll) {
          Write-Error "version.dll for $arch not found in Chrome++ archive — aborting build (portable data would be broken)"
          exit 1
        }
        Copy-Item $dll.FullName Helium_Portable\ -Force
        Write-Host "Chrome++ DLL: $($dll.FullName)"

        # Copy config files
        Copy-Item chrome++.ini,debloater.reg,default-apps-multi-profile.bat,update.bat Helium_Portable\ -Force

        # Copy WidevineCdm
        Copy-Item WidevineCdm Helium_Portable\ -Recurse -Force

        # Write version file
        Set-Content -Path "Helium_Portable\version.txt" -Value "$heliumVer"

        # Safety net: never ship a zip without version.dll — portable data
        # (chrome++.ini data_dir) only works when Chrome++ DLL is loaded.
        if (-not (Test-Path "Helium_Portable\version.dll")) {
          Write-Error "Helium_Portable\version.dll missing before packaging — aborting"
          exit 1
        }

        # Package
        Compress-Archive Helium_Portable "$tag.zip" -Force

        echo "ZIP=$tag.zip" >> $env:GITHUB_ENV
        echo "TAG=$tag" >> $env:GITHUB_ENV
        echo "ARCH=$arch" >> $env:GITHUB_ENV

    - name: Release
      if: steps.skip.outputs.should_skip != 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP }}
        tag_name: ${{ env.TAG }}
        name: Helium ${{ needs.check.outputs.helium_ver }} + Chrome++ ${{ needs.check.outputs.plus_ver }} (${{ matrix.arch }})
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
